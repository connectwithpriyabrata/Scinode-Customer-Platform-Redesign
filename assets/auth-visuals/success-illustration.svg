<svg viewBox="0 0 540 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Botanical Chemist and Human-Friendly Chemistry R&amp;D Vector Art">
  <defs>
    <!-- Soft Warm Gradients -->
    <linearGradient id="warmSunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="flaskLiquidWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberFlask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="terracottaPot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <filter id="softWarmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Soft Organic Blob -->
  <path
    d="M80,180 C50,80 180,40 300,50 C430,60 500,120 480,230 C460,330 360,360 220,350 C110,340 100,250 80,180 Z"
    fill="url(#warmSunGlow)"
  />

  <!-- Subtle Connection Constellation Lines (Soft, warm, non-robotic) -->
  <g stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="120" y1="110" x2="210" y2="80" />
    <line x1="210" y1="80" x2="320" y2="95" />
    <line x1="320" y1="95" x2="420" y2="130" />
    <line x1="210" y1="80" x2="270" y2="170" />
  </g>

  <!-- Soft Molecular Node Pins -->
  <g>
    <circle cx="120" cy="110" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" />
    <text x="120" y="114" text-anchor="middle" fill="#92400E" font-size="9" font-family="sans-serif" font-weight="700">C</text>

    <circle cx="210" cy="80" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <text x="210" y="84" text-anchor="middle" fill="#065F46" font-size="10" font-family="sans-serif" font-weight="700">N₂</text>

    <circle cx="320" cy="95" r="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="320" y="99" text-anchor="middle" fill="#1E40AF" font-size="9" font-family="sans-serif" font-weight="700">O₂</text>

    <circle cx="420" cy="130" r="16" fill="#FDF2F8" stroke="#EC4899" stroke-width="2" />
    <text x="420" y="134" text-anchor="middle" fill="#9D174D" font-size="10" font-family="sans-serif" font-weight="700">H</text>
  </g>

  <!-- Laboratory Wooden Bench Shelf -->
  <rect x="50" y="310" width="440" height="14" rx="7" fill="#E2D9CC" />
  <rect x="70" y="324" width="400" height="4" rx="2" fill="#C8BEB0" opacity="0.6" />

  <!-- Warm Terracotta Plant (Symbolizes Green / Sustainable Chemistry) -->
  <g filter="url(#softWarmShadow)">
    <!-- Pot -->
    <path d="M75,275 L95,275 L91,310 L79,310 Z" fill="url(#terracottaPot)" />
    <rect x="73" y="271" width="24" height="5" rx="2" fill="#EA580C" />
    <!-- Botanical Leaves -->
    <path d="M85,271 Q70,240 60,250 C65,260 78,268 85,271 Z" fill="#10B981" />
    <path d="M85,271 Q95,230 110,245 C105,255 92,266 85,271 Z" fill="#059669" />
    <path d="M85,271 Q85,225 80,230 C88,245 87,260 85,271 Z" fill="#34D399" />
  </g>

  <!-- Erlenmeyer Chemistry Flask (Glass & Emerald Eco-Liquid) -->
  <g filter="url(#softWarmShadow)">
    <!-- Flask Glass Outline -->
    <path
      d="M145,200 L145,225 L115,295 C111,304 118,310 128,310 L182,310 C192,310 199,304 195,295 L165,225 L165,200 Z"
      fill="#FFFFFF"
      fill-opacity="0.85"
      stroke="#94A3B8"
      stroke-width="2.5"
    />
    <!-- Liquid Inside -->
    <path
      d="M123,285 C135,282 145,288 158,284 C168,282 178,287 187,285 L182,308 C180,309 178,310 175,310 L135,310 C132,310 130,309 128,308 Z"
      fill="url(#flaskLiquidWarm)"
    />
    <!-- Measurement Ticks -->
    <line x1="140" y1="250" x2="148" y2="250" stroke="#64748B" stroke-width="1.5" />
    <line x1="137" y1="265" x2="147" y2="265" stroke="#64748B" stroke-width="1.5" />
    <line x1="134" y1="280" x2="146" y2="280" stroke="#64748B" stroke-width="1.5" />
    <!-- Glass Highlight -->
    <path d="M149,206 L149,222 L172,285" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <!-- Bubbles -->
    <circle cx="155" cy="275" r="2.5" fill="#A7F3D0" />
    <circle cx="165" cy="265" r="2" fill="#D1FAE5" />
    <circle cx="145" cy="282" r="1.5" fill="#D1FAE5" />
  </g>

  <!-- Friendly Female Scientist Character (Warm, approachable) -->
  <g filter="url(#softWarmShadow)">
    <!-- Body / Lab Coat -->
    <path
      d="M210,310 C210,250 225,220 255,220 C285,220 300,250 300,310 Z"
      fill="#F8FAFC"
      stroke="#CBD5E1"
      stroke-width="2"
    />
    <!-- Warm ochre knit sweater underneath coat -->
    <path d="M242,220 L268,220 L262,255 L248,255 Z" fill="#F59E0B" />
    <!-- Lab Coat Lapels -->
    <path d="M235,220 L248,275 L238,310" stroke="#94A3B8" stroke-width="1.5" fill="none" />
    <path d="M275,220 L262,275 L272,310" stroke="#94A3B8" stroke-width="1.5" fill="none" />
    <!-- ID Badge clip -->
    <rect x="228" y="250" width="10" height="14" rx="2" fill="#0D9488" />
    <line x1="233" y1="245" x2="233" y2="250" stroke="#64748B" stroke-width="1" />

    <!-- Neck -->
    <rect x="249" y="196" width="12" height="14" rx="3" fill="#FBCFE8" />

    <!-- Head & Glow -->
    <circle cx="255" cy="180" r="22" fill="#FCD34D" opacity="0.25" />
    <circle cx="255" cy="178" r="18" fill="#FDE047" opacity="0.3" />
    <ellipse cx="255" cy="180" rx="16" ry="18" fill="#FBCFE8" />

    <!-- Hair - warm chestnut bun -->
    <path
      d="M236,178 C236,160 248,150 258,150 C272,150 276,162 274,178 C270,166 260,162 248,165 Z"
      fill="#78350F"
    />
    <circle cx="258" cy="146" r="10" fill="#78350F" />

    <!-- Happy eyes & smile -->
    <path d="M248,178 Q251,181 254,178" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M258,178 Q261,181 264,178" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M252,186 Q256,190 260,186" stroke="#9D174D" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Soft rosy cheeks -->
    <circle cx="246" cy="183" r="3" fill="#F472B6" opacity="0.4" />
    <circle cx="265" cy="183" r="3" fill="#F472B6" opacity="0.4" />

    <!-- Hand holding smart tablet / clipboard with checkmark -->
    <rect x="272" y="235" width="46" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2" transform="rotate(-6 272 235)" />
    <rect x="276" y="240" width="38" height="50" rx="4" fill="#F8FAFC" transform="rotate(-6 276 240)" />
    <!-- Verified Spec Checkmark on Tablet -->
    <circle cx="295" cy="258" r="10" fill="#D1FAE5" />
    <path d="M291,258 L294,261 L300,255" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="282" y="274" width="26" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="282" y="280" width="18" height="3" rx="1.5" fill="#94A3B8" />
  </g>

  <!-- Round Bottom Amber Reaction Vessel -->
  <g filter="url(#softWarmShadow)">
    <ellipse cx="380" cy="275" rx="30" ry="30" fill="url(#amberFlask)" />
    <rect x="372" y="225" width="16" height="28" fill="#FFFFFF" fill-opacity="0.75" stroke="#94A3B8" stroke-width="2" />
    <!-- Liquid highlight -->
    <path d="M362,260 Q380,255 398,260 Q398,295 380,300 Q362,295 362,260 Z" fill="#D97706" opacity="0.4" />
    <ellipse cx="370" cy="265" rx="4" ry="7" fill="#FEF3C7" opacity="0.7" transform="rotate(-25 370 265)" />
    <!-- Stand Clamp -->
    <path d="M350,225 L372,238" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="350" y1="210" x2="350" y2="310" stroke="#475569" stroke-width="3.5" />
    <rect x="338" y="306" width="30" height="6" rx="3" fill="#334155" />
  </g>

  <!-- Friendly Sparkles & Chemistry Joy -->
  <g fill="#F59E0B">
    <!-- 4-point star sparkle -->
    <path d="M430,200 Q430,210 440,210 Q430,210 430,220 Q430,210 420,210 Q430,210 430,200 Z" />
    <path d="M185,150 Q185,156 191,156 Q185,156 185,162 Q185,156 179,156 Q185,156 185,150 Z" />
    <path d="M330,150 Q330,157 337,157 Q330,157 330,164 Q330,157 323,157 Q330,157 330,150 Z" />
  </g>

  <!-- Soft Success Ribbon Seal floating -->
  <g filter="url(#softWarmShadow)">
    <rect x="330" y="195" width="135" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="348" cy="212" r="9" fill="#10B981" />
    <path d="M344,212 L347,215 L353,209" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="364" y="211" fill="#0F172A" font-size="11" font-family="sans-serif" font-weight="700">
      Verified Supplier
    </text>
    <text x="364" y="222" fill="#059669" font-size="9" font-family="sans-serif" font-weight="500">
      ISO-9001 &amp; REACH Ready
    </text>
  </g>
</svg>
