<style>
  .rfqdet-toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .rfqdet-toprow .rfqdet-back{margin-bottom:0;}
  .rfqdet-toprow .sbv-toggle button{white-space:nowrap;}
  .rfqdet-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--text-2);text-decoration:none;margin-bottom:16px;transition:color .12s;}
  .rfqdet-back:hover{color:var(--teal-600);}

  .rfqdet-notfound{background:var(--white);border-radius:16px;box-shadow:var(--shadow-card);padding:60px 24px;text-align:center;}
  .rfqdet-notfound h2{font-family:var(--font-heading);font-size:18px;font-weight:600;color:var(--text-1);margin-bottom:8px;}
  .rfqdet-notfound p{font-family:var(--font);font-size:13px;color:var(--text-2);}

  /* Request Details is now 3 visually separate frames, stacked with a 24px gap
     (rather than one continuous card): header (title + ID/status/type/Secure
     badges), status/progress (stepper), then the tabs+body frame. Each frame owns
     its own rounding/shadow instead of relying on a shared outer card. */
  .rfqdet-card{display:flex;flex-direction:column;gap:24px;}
  .rfqdet-header-frame,.rfqdet-progress-frame{position:relative;overflow:hidden;background:radial-gradient(900px 360px at 85% -20%,rgba(2,150,138,.22),transparent 60%),linear-gradient(135deg,#016358 0%,#182133 100%);border-radius:16px;box-shadow:var(--shadow-hero);}
  .rfqdet-header-frame{padding:26px 28px;position:sticky;top:var(--topnav);z-index:5;}
  .rfqdet-progress-frame{padding:22px 28px;}
  .rfqdet-body-frame{border-radius:16px;overflow:hidden;box-shadow:var(--shadow-hero);}
  .rfqdet-title{font-family:var(--font-heading);font-size:22px;font-weight:600;color:#fff;letter-spacing:-0.01em;margin-bottom:12px;}
  .rfqdet-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .rfqdet-id{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;color:rgba(255,255,255,.88);}
  .rfqdet-copy{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:#fff;width:22px;height:22px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s;}
  .rfqdet-copy:hover{background:rgba(255,255,255,.22);}
  .rfqdet-status,.rfqdet-type{font-family:var(--font);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;}
  .rfqdet-type{background:var(--teal-50);color:var(--teal-700);}

  .rfqdet-stepper{display:flex;align-items:center;max-width:920px;}
  .rfqdet-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:110px;}
  .rfqdet-step-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .rfqdet-step-dot.done{background:var(--sage);border-color:var(--sage);color:var(--navy-500);}
  .rfqdet-step-label{font-family:var(--font);font-size:11px;font-weight:600;color:rgba(255,255,255,.85);text-align:center;line-height:1.3;}
  .rfqdet-step-line{flex:1;height:2px;background:rgba(255,255,255,.25);margin:0 -4px 24px;min-width:16px;}
  .rfqdet-step-line.done{background:var(--sage);}

  .rfqdet-body{display:flex;gap:20px;align-items:flex-start;padding:20px 28px 28px;background:var(--page-bg);}
  .rfqdet-log{flex:1;min-width:0;display:flex;flex-direction:column;}
  .rfqdet-stage-row{display:flex;gap:14px;align-items:stretch;}
  .rfqdet-stage-track{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:26px;}
  .rfqdet-track-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-h,#CBD5E1);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .rfqdet-track-dot.done{background:var(--teal-500);border-color:var(--teal-500);}
  .rfqdet-track-dot.current{background:var(--teal-500);border-color:var(--teal-500);}
  .rfqdet-track-line{width:2px;flex:1;min-height:8px;background:var(--border-h,#CBD5E1);margin:2px 0;}
  .rfqdet-track-line.done{background:var(--teal-500);}
  .rfqdet-stage-body{flex:1;min-width:0;padding-bottom:8px;display:flex;flex-direction:column;gap:8px;}

  .rfqdet-current-card{background:var(--teal-600);border-radius:10px;padding:14px 16px;}
  .rfqdet-current-head{display:flex;align-items:center;gap:10px;color:#fff;}
  .rfqdet-current-title{font-family:var(--font);font-size:15px;font-weight:700;color:#fff;}
  .rfqdet-current-date{font-family:var(--font);font-size:11.5px;color:rgba(255,255,255,.75);margin-top:2px;}
  /* Compact "Secure Active" stage-header indicator — icon-only treatment (Option 1
     from the stage-header comparison), right-aligned in .rfqdet-current-head. Sits
     on the solid teal-600 header, so it uses the dark-surface Secure accent
     (secure-200 -> white) rather than the banner pill's light fill: secure-200
     holds 4.81:1 against teal-600, white 7.17:1, so contrast stays safe through the
     whole pulse. Shown on the triggering stage and every stage after it
     (secureActiveByStage). No text label — meaning is carried by the icon plus its
     aria-label/tooltip, so it stays unobtrusive next to the stage title/date. */
  .secure-stage-icon{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:var(--secure-200);cursor:default;}
  .secure-stage-icon svg{width:18px;height:18px;display:block;}
  .secure-stage-icon.beat{animation:secureStageBeat 2.6s ease-in-out infinite;}
  @keyframes secureStageBeat{0%,100%{transform:scale(1);color:var(--secure-200);}50%{transform:scale(1.18);color:#fff;}}
  @media (prefers-reduced-motion:reduce){ .secure-stage-icon.beat{animation:none;} }
  .rfqdet-brief{background:var(--teal-50);border:0.5px solid var(--teal-100);border-radius:10px;padding:16px;}
  .rfqdet-brief-title{font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--text-1);}
  .rfqdet-brief-sub{font-family:var(--font);font-size:11.5px;color:var(--text-2);margin-top:2px;margin-bottom:10px;}
  .rfqdet-brief-body{font-family:var(--font);font-size:12.5px;color:var(--text-1);line-height:1.6;background:#fff;border-radius:8px;padding:12px 14px;}
  .rfqdet-alert{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:13px 15px;font-family:var(--font);font-size:12.5px;line-height:1.6;}
  .rfqdet-alert span{flex-shrink:0;margin-top:1px;}
  .rfqdet-alert-info{background:#EFF6FF;border:0.5px solid #BFDBFE;color:#1E40AF;}
  .rfqdet-alert-done{background:#D4F0EE;border:0.5px solid var(--teal-100);color:#016358;}
  .rfqdet-log-row{background:#fff;border-radius:8px;padding:11px 14px;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--text-3,#94A3B8);}
  .rfqdet-log-row.done{color:var(--text-2);font-weight:600;}

  .rfqdet-side{display:contents;}
  .rfqdet-rep-card{background:var(--teal-50);border-radius:14px;padding:18px;}
  .rfqdet-rep-head{display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--navy-500);margin-bottom:12px;}
  .rfqdet-rep-head svg{color:var(--teal-600);flex-shrink:0;}
  .rfqdet-info-card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow-card);}
  .rfqdet-info-title{font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--navy-500);margin-bottom:12px;}
  .rfqdet-field{margin-bottom:12px;}
  .rfqdet-field:last-child{margin-bottom:0;}
  .rfqdet-field-label{font-family:var(--font);font-size:11.5px;color:var(--text-2);margin-bottom:2px;}
  .rfqdet-field-label.teal{color:var(--teal-600);font-weight:600;}
  .rfqdet-field-value{font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--text-1);}
  .rfqdet-field-value.normal{font-weight:400;line-height:1.55;color:var(--text-2);}
  .rfqdet-field-row{display:flex;gap:16px;margin-bottom:12px;}
  .rfqdet-field-row .rfqdet-field{flex:1;margin-bottom:0;}
  .rfqdet-product-box{background:var(--teal-50);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .rfqdet-product-name{font-family:var(--font);font-size:14px;font-weight:700;color:var(--text-1);margin-top:2px;line-height:1.4;}

  /* Documents sidebar card (Classic View only — see DOCS_TAB_MODE gate around
     renderDetailCard) — a compact entry point only, per spec: "the right rail
     should communicate everything is here, while the drawer does the actual
     browsing." Reuses .rfqdet-info-card/.rfqdet-info-title so it sits between
     "Request Details" and "Scinode Secure" without inventing a new card shell. */
  .rfqdet-docs-card-sub{font-family:var(--font);font-size:11.5px;color:var(--text-2);line-height:1.5;margin-bottom:12px;}
  .rfqdet-docs-card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--font);font-size:11px;background:var(--teal-50);border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .rfqdet-docs-card-count{font-weight:700;color:var(--text-1);}

  .rfqdet-docs-card-cats{color:var(--text-2);}
  .rfqdet-docs-card-cta{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--teal-600);cursor:pointer;}
  .rfqdet-docs-card-cta:hover{color:var(--teal-500);}
  .rfqdet-docs-card-cta svg{transition:transform .15s;}
  .rfqdet-docs-card-cta:hover svg{transform:translateX(3px);}
  .rfqdet-docs-card-empty{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:4px 0 2px;}
  .rfqdet-docs-card-empty svg{color:var(--text-3,#94A3B8);width:22px;height:22px;margin-bottom:4px;}
  .rfqdet-docs-card-empty-title{font-family:var(--font-heading);font-size:13px;font-weight:600;color:var(--text-1);}
  .rfqdet-docs-card-empty-sub{font-family:var(--font);font-size:11.5px;color:var(--text-2);line-height:1.5;}
  /* Preview-only toggle — the mock catalog always has documents, so the empty

  .rfqdet-docs-card-demo{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);flex-wrap:wrap;}
  .rfqdet-docs-card-demo-label{font-family:var(--font);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3,#94A3B8);}

  /* Three-way layout picker sitting above the Documents card — a demo-only

  .rfqdet-docs-layout-toggle-label{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3,#94A3B8);}

  .rfqdet-docs-vault{display:flex;flex-direction:column;}

  .rfqdet-docs-vault-protected svg{color:var(--success-600,#16A34A);}

  .rfqdet-docs-vault-badge{position:absolute;top:14px;right:14px;background:var(--teal-50);border:1px solid var(--teal-100);color:var(--teal-700);font-family:var(--font);font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;}

  .rfqdet-docs-vault-chips{display:flex;gap:8px;margin-bottom:16px;}

  .rfqdet-docs-vault-chip .label{font-family:var(--font);font-size:10.5px;color:var(--text-2);margin-top:2px;}

  .rfqdet-docs-analytics-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}

  .rfqdet-docs-analytics-ring-label .unit{font-family:var(--font);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--text-3,#94A3B8);margin-top:2px;}

  .rfqdet-docs-analytics-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .rfqdet-docs-analytics-dot.secure{background:var(--navy-900,#021C26);}
  .rfqdet-docs-analytics-label{flex:1;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--text-1);}
  .rfqdet-docs-analytics-val{font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--text-1);white-space:nowrap;}

  .rfqdet-quote-price-label{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--teal-600);}
  .rfqdet-quote-price-val{font-family:var(--font-heading);font-size:24px;font-weight:700;color:var(--text-1);margin-top:2px;}
  .rfqdet-quote-price-sub{font-family:var(--font);font-size:11px;color:var(--text-2);margin-top:2px;}
  .rfqdet-quote-name{font-family:var(--font);font-size:13px;font-weight:600;color:var(--text-1);}
  .rfqdet-quote-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .rfqdet-quote-field-label{font-family:var(--font);font-size:11px;color:var(--text-2);}
  .rfqdet-quote-field-val{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--text-1);margin-top:1px;}
  .rfqdet-quote-expiry{background:#FEF2F2;border:0.5px solid #FCA5A5;border-radius:8px;padding:10px 13px;font-family:var(--font);font-size:12px;color:#991B1B;}
  .rfqdet-quote-expiry b{display:block;font-size:12.5px;margin-top:1px;}
  .rfqdet-quote-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .rfqdet-quote-validity{font-family:var(--font);font-size:11.5px;color:var(--text-2);}
  .rfqdet-btn{font-family:var(--font);font-size:12px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:none;transition:opacity .12s;}
  .rfqdet-btn:hover{opacity:.88;}
  .rfqdet-btn-primary{background:var(--teal-500);color:#fff;}
  .rfqdet-btn-secondary{background:var(--teal-50);color:var(--teal-700);}

  .rfqdet-po-form{background:#fff;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .rfqdet-po-label{font-family:var(--font);font-size:12px;font-weight:600;color:var(--text-1);margin-bottom:5px;display:block;}
  .rfqdet-po-input,.rfqdet-po-file{font-family:var(--font);font-size:12.5px;color:var(--text-1);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box;}
  .rfqdet-po-file{padding:7px 11px;}

  .rfqdet-confirm-panel{background:#fff;border-radius:10px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .rfqdet-confirm-title{font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--text-1);}
  .rfqdet-confirm-sub{font-family:var(--font);font-size:12px;color:var(--text-2);max-width:360px;}

  .rfqdet-fact-card{background:#fff;border-radius:10px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .rfqdet-tag{display:inline-block;background:var(--teal-50);color:var(--teal-700);font-family:var(--font);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .rfqdet-list{margin:0;padding-left:18px;font-family:var(--font);font-size:12.5px;color:var(--text-1);line-height:1.8;}

  /* Tab widget (Process Finalised / Partner Shortlisted / Lab & Plant Match, etc.) */
  .rfqdet-tabs{display:flex;gap:4px;background:var(--page-bg);border-radius:8px;padding:3px;width:fit-content;}
  .rfqdet-tabbtn{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--text-2);background:none;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s;}
  .rfqdet-tabbtn.active{background:#fff;color:var(--text-1);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .rfqdet-tabpanels{background:#fff;border-radius:10px;padding:16px;margin-top:8px;}
  .rfqdet-taggroup-label{font-family:var(--font);font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
  .rfqdet-taggroup{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .rfqdet-taggroup:last-child{margin-bottom:0;}

  /* CMO/CDMO re-engagement nudge (unscheduled "Talk to an expert") */
  .rfqdet-nudge-badge{background:rgba(229,214,46,.28);color:#5C4A00;font-family:var(--font);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block;margin-bottom:8px;}
  .rfqdet-nudge-title{font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--text-1);}
  .rfqdet-nudge-sub{font-family:var(--font);font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.5;}
  .rfqdet-benefit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:14px 0;}
  .rfqdet-benefit-tile{background:var(--teal-50);border-radius:10px;padding:12px;}
  .rfqdet-benefit-title{font-family:var(--font);font-size:12px;font-weight:700;color:var(--text-1);margin-top:6px;}
  .rfqdet-benefit-desc{font-family:var(--font);font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.5;}
  .rfqdet-testimonial{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);}
  .rfqdet-testimonial-quote{display:flex;align-items:center;gap:10px;}
  .rfqdet-testimonial-avatar{width:34px;height:34px;border-radius:50%;background:var(--teal-500);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:12px;font-weight:700;flex-shrink:0;}
  .rfqdet-testimonial-text{font-family:var(--font);font-size:11.5px;color:var(--text-1);line-height:1.5;max-width:400px;}
  .rfqdet-testimonial-name{font-family:var(--font);font-size:11px;font-weight:700;color:var(--teal-600);margin-top:2px;}
  .rfqdet-live-dot{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:11px;font-weight:600;color:var(--teal-600);white-space:nowrap;}
  .rfqdet-live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;}
  .rfqdet-nudge-cta{background:var(--page-bg);border-radius:10px;padding:14px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  /* Tiered pricing table (R&D proposal) */
  .rfqdet-price-table{width:100%;border-collapse:collapse;font-family:var(--font);font-size:12px;}
  .rfqdet-price-table th{text-align:left;font-size:10.5px;font-weight:600;color:var(--text-2);padding:6px 10px;border-bottom:1px solid var(--border);}
  .rfqdet-price-table td{padding:8px 10px;color:var(--text-1);border-bottom:1px solid var(--page-bg);}
  .rfqdet-price-table tr:last-child td{border-bottom:none;}
  .rfqdet-doc-chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .rfqdet-doc-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--teal-700);cursor:pointer;}

  @media (max-width:860px){
    .rfqdet-body{flex-direction:column;}
    .rfqdet-side-col{width:100%;}
    .rfqdet-stepper{max-width:100%;}
  }

  /* ---------- Scinode Secure (trust-framework overlay, all 6 request types) ----------
     Per the scinode-secure-design-system skill: Secure Indigo (--secure-*) is a
     dedicated semantic identity, distinct from brand teal and from status colors.
     Active/Uploaded/Signed states use --success-* (green), never teal or indigo. */

  /* Single identity pill sits inline among the other pills in the dark Request
     Details banner, matching that row's existing solid-chip pattern (Status/Type).
     Deeper #CCD3F8 fill (a custom step between secure-200 and secure-300, chosen
     over the light secure-100 tint for a much more distinguishable chip) stays
     fixed in both states; in the Active state a light sweep crosses the pill while
     the icon carries its own slow scale + color-deepen pulse underneath, so the
     two read as one combined "alive" signal rather than two competing animations.
     The icon pulse stays within the Indigo family (secure-800 -> secure-900)
     rather than shifting to Success green, which would fail contrast at this
     lightness. Same restrained cadence as the Dashboard's own Scinode Secure
     motion (secPulse/secFloat in scinode.css), never a fast/urgent blink, per the
     Secure design system's "confidence, not urgency" motion guidance. */
  .secure-id-pill{display:inline-flex;align-items:center;gap:6px;background:var(--secure-200);color:var(--secure-800);font-family:var(--font);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;border:none;position:relative;overflow:hidden;transition:opacity .12s;}
  .secure-id-pill.corner{position:absolute;top:26px;right:28px;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.16);}
  .secure-id-pill:hover{opacity:.85;}
  .secure-id-icon{display:inline-flex;}
  .secure-id-pill.active::after{content:'';position:absolute;top:0;bottom:0;width:46%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 100%);transform:translateX(-160%);animation:secureIdShimmer 3.4s ease-in-out infinite;}
  .secure-id-pill.active .secure-id-icon{animation:secureIdBeat 2.6s ease-in-out infinite;}
  @keyframes secureIdShimmer{0%{transform:translateX(-160%);}55%,100%{transform:translateX(220%);}}
  @keyframes secureIdBeat{0%,100%{transform:scale(1);color:var(--secure-800);}50%{transform:scale(1.18);color:var(--secure-900);}}
  @media (prefers-reduced-motion:reduce){ .secure-id-pill.active::after,.secure-id-pill.active .secure-id-icon{animation:none;} }

  .rfqdet-side-col{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}

  .secure-req-card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow-card);}
  .secure-req-title-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .secure-req-title{font-family:var(--font-heading);font-size:13.5px;font-weight:600;color:var(--navy-500);}
  .trust-eyebrow{font-family:var(--font);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--secure-700);margin-top:1px;}
  .secure-info-pill{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--secure-100);color:var(--secure-600);border:none;padding:0;cursor:pointer;flex-shrink:0;transition:background .12s;margin-left:8px;}
  .secure-info-pill:hover{background:var(--secure-200);}
  .secure-info-pill svg{width:11px;height:11px;}
  /* Collapse toggle for the Trust Framework panel. */
  .secure-vault-toggle{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:none;color:var(--text-2);border:none;padding:0;cursor:pointer;flex-shrink:0;transition:background .12s;}
  .secure-vault-toggle:hover{background:var(--page-bg);}
  .secure-vault-toggle svg{transition:transform .18s;}
  .secure-vault-toggle[aria-expanded="true"] svg{transform:rotate(180deg);}
  .trust-intro{font-family:var(--font);font-size:11.5px;color:var(--text-2);line-height:1.5;margin-bottom:4px;}
  .trust-pillar{display:flex;gap:10px;padding:12px 0;border-bottom:0.5px solid var(--page-bg);}
  .trust-pillar:last-of-type{border-bottom:none;padding-bottom:0;}
  .trust-pillar-icon{width:28px;height:28px;border-radius:8px;background:var(--secure-50);color:var(--secure-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .trust-pillar-body{min-width:0;}
  .trust-pillar-title{font-family:var(--font);font-size:12px;font-weight:700;color:var(--text-1);}
  .trust-pillar-desc{font-family:var(--font);font-size:11px;color:var(--text-2);line-height:1.5;margin-top:2px;}
  .trust-pillar-status{display:inline-flex;align-items:center;gap:4px;font-family:var(--font);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:7px;white-space:nowrap;}
  .trust-pillar-status svg{width:10px;height:10px;flex-shrink:0;}
  .trust-pillar-status.ok{background:var(--success-100);color:var(--success-700);}
  .trust-pillar-status.warn{background:var(--status-warning-bg);color:var(--status-warning-fg);}
  .trust-pillar-status.always{background:var(--secure-100);color:var(--secure-700);}
  .secure-req-empty{font-family:var(--font);font-size:11.5px;color:var(--text-2);line-height:1.5;}
  .secure-req-table{width:100%;border-collapse:collapse;font-family:var(--font);font-size:11.5px;}
  .secure-req-table th{text-align:left;font-size:10px;font-weight:600;color:var(--text-2);padding:5px 6px;border-bottom:1px solid var(--border);}
  .secure-req-table td{padding:8px 6px;color:var(--text-1);border-bottom:1px solid var(--page-bg);vertical-align:middle;}
  .secure-req-table tr:last-child td{border-bottom:none;}
  .secure-req-badge{font-family:var(--font);font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .secure-req-badge.neutral{background:var(--page-bg);color:var(--text-2);}
  .secure-req-badge.warn{background:var(--status-warning-bg);color:var(--status-warning-fg);}
  .secure-req-badge.ok{background:var(--success-100);color:var(--success-700);}
  .secure-req-badge.danger{background:var(--status-error-bg);color:var(--status-error-fg);}
  .secure-req-reject-reason{font-family:var(--font);font-size:10.5px;color:var(--status-error-fg);line-height:1.5;margin-top:3px;}
  .secure-req-action{background:none;border:none;color:var(--secure-600);font-family:var(--font);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;white-space:nowrap;}
  .secure-req-action-ghost{color:var(--text-2);}
  .secure-req-action-none{color:var(--text-3,#94A3B8);font-family:var(--font);font-size:11.5px;}
  .secure-req-action-group{display:inline-flex;align-items:center;gap:10px;}
  .secure-req-hist-link{background:none;border:none;color:var(--secure-600);font-family:var(--font);font-size:10.5px;font-weight:600;cursor:pointer;padding:0;white-space:nowrap;text-decoration:underline;text-underline-offset:2px;}

  .secure-upload-draft{background:var(--secure-50);border:0.5px solid var(--secure-200);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .secure-upload-draft-file{display:flex;align-items:center;gap:6px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--navy-500);}
  .secure-upload-draft-file svg{color:var(--secure-600);flex-shrink:0;}
  .secure-upload-draft-note{width:100%;min-height:52px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:11.5px;color:var(--text-1);background:#fff;}
  .secure-upload-draft-note:focus{outline:none;border-color:var(--secure-300);}
  .secure-upload-draft-actions{display:flex;justify-content:flex-end;gap:8px;}
  .secure-upload-draft-actions .mfg-btn-primary,.secure-upload-draft-actions .mfg-btn-secondary{padding:7px 13px;font-size:11.5px;}

  .secure-card{background:var(--secure-50);border:0.5px solid var(--secure-200);border-radius:12px;padding:16px;margin-top:4px;}
  .secure-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .secure-card-head-left{display:flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--navy-500);}
  .secure-card-head-left svg{color:var(--secure-600);flex-shrink:0;}
  .secure-card-pill{display:inline-flex;align-items:center;gap:4px;background:var(--secure-100);color:var(--secure-700);font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;}
  .secure-card-pill svg{color:var(--success-600);flex-shrink:0;}
  .secure-card-desc{font-family:var(--font);font-size:11.5px;color:var(--text-2);line-height:1.6;}
  .secure-why-trigger{display:inline-flex;align-items:center;justify-content:center;background:none;border:none;padding:1px;margin:0;color:var(--text-3,#94A3B8);cursor:pointer;flex-shrink:0;}
  .secure-why-trigger:hover,.secure-why-trigger:focus-visible{color:var(--secure-600);}
  /* Rendered into document.body (see showSecureWhyTooltip) rather than nested inside
     the trigger — .rfqdet-card has overflow:hidden for its rounded corners, which
     would otherwise clip an absolutely-positioned tooltip. */
  .secure-why-tip{position:fixed;width:240px;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.16);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .14s,transform .14s,visibility .14s;z-index:500;text-align:left;pointer-events:none;}
  .secure-why-tip.open{opacity:1;visibility:visible;transform:translateY(0);}
  .secure-why-tip-title{font-family:var(--font);font-size:10.5px;font-weight:700;color:var(--text-1);margin-bottom:4px;}
  .secure-why-tip-body{font-family:var(--font);font-size:11px;color:var(--text-2);line-height:1.5;}
  .secure-card .secure-req-table{background:#fff;border-radius:8px;}
  .secure-card .secure-req-table th,.secure-card .secure-req-table td{padding:8px 10px;}

  /* Version History drawer — right-side sliding panel, opened from either the
     Timeline card or the Vault panel. Fixed/body-level so .rfqdet-card's
     overflow:hidden can't clip it, same rationale as .secure-why-tip above. */
  .secure-hist-backdrop{position:fixed;inset:0;background:rgba(4,20,28,.32);opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;z-index:600;}
  .secure-hist-backdrop.open{opacity:1;visibility:visible;}
  .secure-hist-drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:#fff;box-shadow:-16px 0 40px rgba(4,62,84,.16);z-index:601;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;}
  .secure-hist-drawer.open{transform:translateX(0);}
  .secure-hist-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .secure-hist-eyebrow{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secure-700);margin-bottom:4px;}
  .secure-hist-title{font-family:var(--font-heading);font-size:15px;font-weight:600;color:var(--navy-500);}
  .secure-hist-body{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:12px;}
  .secure-hist-prev-label{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3,#94A3B8);margin:6px 0 -2px;}
  .secure-hist-card{background:var(--page-bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
  .secure-hist-card.current{background:var(--secure-50);border:0.5px solid var(--secure-200);}
  .secure-hist-current-tag{font-family:var(--font);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--secure-700);}
  .secure-hist-card-top{display:flex;align-items:center;gap:8px;}
  .secure-hist-version{font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--navy-500);}
  .secure-hist-meta{font-family:var(--font);font-size:10.5px;color:var(--text-2);}
  .secure-hist-note,.secure-hist-comment{font-family:var(--font);font-size:11px;color:var(--text-2);line-height:1.5;}
  .secure-hist-note span,.secure-hist-comment span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3,#94A3B8);margin-bottom:2px;}
  .secure-hist-actions{display:flex;gap:14px;margin-top:2px;}

  /* Documents drawer (Classic View) — same fixed/transform/backdrop mechanics as
     .secure-hist-drawer above, just wider (520-600px target) since it holds a
     document table rather than a version list. Kept as its own component instead
     of widening .secure-hist-drawer, which is used elsewhere for something
     unrelated (Secure requirement version history). */
  .rfqdet-docs-drawer-backdrop{position:fixed;inset:0;background:rgba(4,20,28,.32);opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;z-index:600;}
  .rfqdet-docs-drawer-backdrop.open{opacity:1;visibility:visible;}
  .rfqdet-docs-drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:#fff;box-shadow:-16px 0 40px rgba(4,62,84,.16);z-index:601;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;}
  .rfqdet-docs-drawer.open{transform:translateX(0);}
  .rfqdet-docs-drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .rfqdet-docs-drawer-title{font-family:var(--font-heading);font-size:17px;font-weight:600;color:var(--navy-500);}
  .rfqdet-docs-drawer-sub{font-family:var(--font);font-size:12px;color:var(--text-2);margin-top:3px;}
  .rfqdet-docs-drawer-body{flex:1;overflow-y:auto;padding:16px 20px 24px;}
  @media (max-width:640px){ .rfqdet-docs-drawer{width:100%;max-width:100%;} }

  /* Trust modal — visually relatable to the Dashboard's Trust Center modal
     (dark gradient box, ribbon strip, shield badge, card grid, footer). */
  /* Light variant — matches the Dashboard Trust Center's "Light" mode: white/mint
     gradient surface, teal-600 accents, navy-500 headings. */
  .secure-modal .modal-box{position:relative;max-width:640px;padding:32px 30px 26px;border-radius:20px;background:linear-gradient(160deg,#FFFFFF 0%,#F4FBFA 45%,#EFFAF6 100%);box-shadow:0 24px 60px rgba(4,62,84,.18);}

  .secure-modal .modal-close:hover{background:#F1F5F9;border-color:var(--border-h);color:var(--text-1);}

<script>
(function(){

  /* Shared across every request type (see UX doc §3.2 — same 5 labels regardless of type). */
  var STEPPER_STAGES = ['Requirement Submitted','Talk to an Expert','Lab & Plant Match','Proposal Ready','Request Closed'];
  /* Per-type log-stage lists (e.g. RFQ_LOG_STAGES, RFS_LOG_STAGES) live in requests-data.js,
     shared with the list-card "Stage:" label. */

  function stageIndexFor(progress, stagesLength){
    var n = progress >= 100 ? stagesLength - 1 : Math.floor(progress / (100 / stagesLength));
    return Math.max(0, Math.min(stagesLength - 1, n));
  }
  function stepperCompletedCount(req){
    var n = req.progress >= 100 ? STEPPER_STAGES.length : Math.floor(req.progress / 20);
    return Math.max(1, Math.min(STEPPER_STAGES.length, n));
  }

  function stepperHtml(req){
    var completed = stepperCompletedCount(req);
    var checkIcon = '<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    var nodes = STEPPER_STAGES.map(function(label, i){
      var done = i < completed;
      return '<div class="rfqdet-step">' +
        '<div class="rfqdet-step-dot' + (done ? ' done' : '') + '">' + (done ? checkIcon : '') + '</div>' +
        '<div class="rfqdet-step-label">' + esc(label) + '</div>' +
      '</div>' +
      (i < STEPPER_STAGES.length - 1 ? '<div class="rfqdet-step-line' + (i < completed - 1 ? ' done' : '') + '"></div>' : '');
    }).join('');
    return '<div class="rfqdet-stepper">' + nodes + '</div>';
  }

  /* Compact "Secure Active" indicator for a timeline stage header — icon-only
     (Option 1), right-aligned in .rfqdet-current-head. Shown on the triggering
     stage and every stage after it (see secureActiveByStage), not just the single
     stage that first introduced Collaboration Requirements. Icon-only means the
     meaning is carried by aria-label/title rather than visible text. */
  function secureStagePillHtml(){
    return '<span class="secure-stage-icon beat" role="img" aria-label="Scinode Secure active from this stage" title="Scinode Secure active from this stage">' +
      ICON_SHIELD_CHECK +
    '</span>';
  }

  /* Shared accordion shell: renders the track dots/lines + stage header for every
     stage in `stages`, delegating the stage-specific body to stageBodyFn(i, currentIdx). */
  function renderStageAccordion(stages, currentIdx, lastUpdated, stageBodyFn, typeKey){
    var rowsHtml = stages.map(function(label, i){
      var state = i < currentIdx ? 'done' : i === currentIdx ? 'current' : 'upcoming';
      var dotHtml = state === 'done' ? ICON_CHECK : '';
      var trackCell = '<div class="rfqdet-stage-track">' +
        '<div class="rfqdet-track-dot ' + state + '">' + dotHtml + '</div>' +
        (i < stages.length - 1 ? '<div class="rfqdet-track-line ' + (state === 'done' ? 'done' : '') + '"></div>' : '') +
      '</div>';

      var bodyCell;
      if (state === 'upcoming'){
        bodyCell = '<div class="rfqdet-stage-body"><div class="rfqdet-log-row">' + esc(label) + '</div></div>';
      } else {
        var secureActive = typeKey && secureActiveByStage(typeKey, i);
        bodyCell = '<div class="rfqdet-stage-body">' +
          '<div class="rfqdet-current-card" style="' + (state === 'current' ? '' : 'opacity:.92;') + '">' +
            '<div class="rfqdet-current-head">' + ICON_FILE_CLOCK +
              '<div><div class="rfqdet-current-title">' + esc(label) + '</div><div class="rfqdet-current-date">' + esc(formatDate(lastUpdated)) + '</div></div>' +
              (secureActive ? secureStagePillHtml() : '') +
            '</div>' +
          '</div>' +
          stageBodyFn(i, currentIdx) +
        '</div>';
      }

      return '<div class="rfqdet-stage-row">' + trackCell + bodyCell + '</div>';
    }).join('');

    return '<div class="rfqdet-log">' + rowsHtml + '</div>';
  }

  /* Generic tab widget reused by Process Finalised, Partner Shortlisted, Lab & Plant
     Match, etc. — call with an array of {label, html} and it renders a self-contained

  var tabWidgetSeq = 0;
  function tabWidgetHtml(tabs){
    var wid = 'tabw' + (tabWidgetSeq++);
    var tabBtns = tabs.map(function(t, i){
      return '<button type="button" class="rfqdet-tabbtn' + (i === 0 ? ' active' : '') + '" onclick="rfqSwitchTab(\'' + wid + '\',' + i + ')" id="' + wid + '-btn-' + i + '">' + esc(t.label) + '</button>';
    }).join('');
    var panels = tabs.map(function(t, i){
      return '<div id="' + wid + '-panel-' + i + '"' + (i === 0 ? '' : ' style="display:none;"') + '>' + t.html + '</div>';
    }).join('');
    return '<div class="rfqdet-tabs">' + tabBtns + '</div><div class="rfqdet-tabpanels">' + panels + '</div>';
  }
  window.rfqSwitchTab = function(wid, idx){

  };

  /* ---------- Scinode Secure (trust-framework overlay) ---------- */
  var ICON_SHIELD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>';
  var ICON_SHIELD_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>';
  var ICON_INFO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
  var ICON_LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  var ICON_USERS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
  var ICON_SCALE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m7 21 5-1 5 1"/><path d="M5 7 2 13a3 3 0 0 0 6 0L5 7Z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0l-3-6Z"/><path d="M5 7h14"/><path d="M9 3h6"/></svg>';
  var ICON_BRIEFCASE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>';
  var SECURE_PILLAR_ICONS = { ip:ICON_LOCK, collab:ICON_USERS, legal:ICON_SCALE, data:ICON_DOC, security:ICON_SHIELD_CHECK };

  var ICON_SEARCH = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';

  /* typeKey used throughout the Secure data model is exactly req.type, and every
     type's own *_LOG_STAGES array (defined in requests-data.js) gives the stage

  var SECURE_TYPE_STAGE_LENGTHS = {

    'Sample Request': RFS_LOG_STAGES.length,
    'Consultation': CONSULT_LOG_STAGES.length,
    'Manufacturing Project': CMO_LOG_STAGES.length,
    'CDMO Project': CDMO_LOG_STAGES.length,
    'R&D Project': RD_LOG_STAGES.length
  };

  function formatDateTime(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var h = d.getHours(), ampm = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
    var min = ('0' + d.getMinutes()).slice(-2);
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' • ' + h12 + ':' + min + ' ' + ampm;
  }

  function secureStatusPillHtml(status){
    var cls = status === 'Approved' ? 'ok' : status === 'Rejected' ? 'danger' : status === 'Under Review' ? 'warn' : 'neutral';
    return '<span class="secure-req-badge ' + cls + '">' + esc(status) + '</span>';
  }

  /* Transient "file chosen, awaiting Submit" state for the upload-with-change-note
     mini form — never persisted; cleared on Submit/Cancel. Keyed by "reqId|code". */
  var secureUploadDrafts = {};

  /* Collapsed/expanded state of the "Scinode Secure Vault" panel — a plain module
     var (not localStorage) since it only needs to survive re-renders within this
     page session, same pattern as secureUploadDrafts above. Defaults open. */
  var secureVaultCollapsed = false;
  window.toggleSecureVault = function(){
    secureVaultCollapsed = !secureVaultCollapsed;
    init();
  };

  /* Active once Secure has actually been triggered for this request — either the
     customer opted in on the creation form ("Secure this Request", recorded as a
     'Scinode Secure' specification entry), or the timeline has reached a stage
     that introduces real Collaboration Requirements (buildSecureRequirements). */
  function secureIsActive(req, typeKey, currentIdx){
    var formOptIn = (req.specifications || []).some(function(s){ return s.label === 'Scinode Secure'; });
    if (formOptIn) return true;
    return buildSecureRequirements(req, typeKey, currentIdx).length > 0;
  }

  /* Pinned to the top-right corner of the Request Details banner (separate from the
     Request ID / Status / Type badges row) so it stands out as its own signal rather
     than blending into the badge row; clicking it opens the Trust modal below, in
     both states. Label stays "Scinode Secure" in both states — active vs. inactive
     is now communicated entirely by the pill's fill/motion, not by appending text. */
  function secureBadgeHtml(req, typeKey, currentIdx){
    var active = secureIsActive(req, typeKey, currentIdx);
    return '<button type="button" class="secure-id-pill corner' + (active ? ' active' : '') + '" onclick="openSecureModal()">' +
      '<span class="secure-id-icon">' + ICON_SHIELD_CHECK + '</span> Scinode Secure' +
    '</button>';
  }

  window.openSecureModal = function(){
    var m = document.getElementById('secure-modal');
    if (!m) return;
    m.classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeSecureModal = function(){
    var m = document.getElementById('secure-modal');
    if (!m) return;
    m.classList.remove('open');
    document.body.style.overflow = '';
  };
  window.handleSecureModalBackdropClick = function(e){
    if (e.target === document.getElementById('secure-modal')) closeSecureModal();
  };

  /* Version History drawer — right-side panel, opened from either the view-only
     Vault row or the functional Timeline row for the same requirement/code. */
  window.openSecureVersionHistory = function(reqId, code){
    var req = getAllRequests().find(function(r){ return r.id === reqId; });
    if (!req) return;
    var stagesLen = SECURE_TYPE_STAGE_LENGTHS[req.type] || 20;
    var r = buildSecureRequirements(req, req.type, stagesLen - 1).filter(function(x){ return x.code === code; })[0];
    if (!r) return;
    document.getElementById('secure-hist-eyebrow').textContent = 'Version History';
    document.getElementById('secure-hist-title').textContent = r.label || r.code;
    var versions = r.versions.slice().reverse();
    var body;
    if (!versions.length){
      body = '<div class="secure-req-empty">No document has been uploaded for this requirement yet.</div>';
    } else {
      var current = versions[0], older = versions.slice(1);
      body = secureHistCardHtml(current, true) +
        '<div class="secure-hist-prev-label">Previous Versions</div>' +
        (older.length
          ? older.map(function(v){ return secureHistCardHtml(v, false); }).join('')
          : '<div class="secure-req-empty">No previous versions available. Future uploads or replacements will appear here automatically.</div>');
    }
    document.getElementById('secure-hist-body').innerHTML = body;
    document.getElementById('secure-hist-drawer').classList.add('open');
    document.getElementById('secure-hist-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeSecureVersionHistory = function(){
    var d = document.getElementById('secure-hist-drawer');
    var b = document.getElementById('secure-hist-backdrop');
    if (d) d.classList.remove('open');
    if (b) b.classList.remove('open');
    document.body.style.overflow = '';
  };
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    closeSecureModal();
    closeSecureVersionHistory();
    closeDocumentsDrawer();
  });

  function secureHistCardHtml(v, isCurrent){
    return '<div class="secure-hist-card' + (isCurrent ? ' current' : '') + '">' +
      (isCurrent ? '<div class="secure-hist-current-tag">Current Version</div>' : '') +
      '<div class="secure-hist-card-top"><span class="secure-hist-version">' + esc(v.version) + '</span>' + secureStatusPillHtml(v.status) + '</div>' +
      '<div class="secure-hist-meta">Uploaded by ' + esc(v.uploadedBy) + ' · ' + formatDateTime(v.uploadedAt) + '</div>' +
      (v.changeNote ? '<div class="secure-hist-note"><span>Change Note</span>' + esc(v.changeNote) + '</div>' : '') +
      (v.reviewComment ? '<div class="secure-hist-comment"><span>Review Comments</span>' + esc(v.reviewComment) + '</div>' : '') +
      '<div class="secure-hist-actions">' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureViewDoc(\'' + esc(v.fileName) + '\')">View</button>' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureDownloadDoc(\'' + esc(v.fileName) + '\')">Download</button>' +
      '</div>' +
    '</div>';
  }


  /* Functional row for the Timeline Secure Card. Action depends on the requirement's
     document-review status: Pending Upload -> Upload; Under Review -> no action
     (awaiting Scinode); Approved -> View/Download; Rejected -> Upload New Version
     (old version preserved, never deleted — see saveSecureVersions). Admin-managed
     requirements (MSA) are always View-only; the customer never uploaded it. */
  function secureReqRowFunctionalHtml(reqId, r){
    var draftKey = reqId + '|' + r.code;
    var draftFile = secureUploadDrafts[draftKey];
    var inputId = 'secure-file-' + reqId + '-' + r.code;
    var noteId = 'secure-note-' + reqId + '-' + r.code;
    var hiddenInput = '<input type="file" id="' + inputId + '" style="display:none" onchange="secureFileChosen(\'' + esc(reqId) + '\',\'' + r.code + '\', this)">';

    if (draftFile){
      return '<tr><td colspan="5"><div class="secure-upload-draft">' +
        '<div class="secure-upload-draft-file">' + ICON_DOC + esc(draftFile.name) + '</div>' +
        '<textarea class="secure-upload-draft-note" id="' + noteId + '" placeholder="Optional change note"></textarea>' +
        '<div class="secure-upload-draft-actions">' +
          '<button type="button" class="mfg-btn-secondary" onclick="secureCancelUpload(\'' + esc(reqId) + '\',\'' + r.code + '\')">Cancel</button>' +
          '<button type="button" class="mfg-btn-primary" onclick="secureConfirmUpload(\'' + esc(reqId) + '\',\'' + r.code + '\')">Submit for Review</button>' +
        '</div>' +
      '</div></td></tr>';
    }

    var viewBtn = '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureViewDoc(\'' + esc(r.doc && r.doc.fileName) + '\')">View</button>';
    var downloadBtn = '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureDownloadDoc(\'' + esc(r.doc && r.doc.fileName) + '\')">Download</button>';
    var uploadLabel = r.status === 'Pending Upload' ? 'Upload' : 'Upload New Version';
    var uploadBtn = '<button type="button" class="secure-req-action" onclick="document.getElementById(\'' + inputId + '\').click()">' + uploadLabel + '</button>' + hiddenInput;
    var historyBtn = r.versions.length
      ? '<button type="button" class="secure-req-hist-link" onclick="openSecureVersionHistory(\'' + esc(reqId) + '\',\'' + r.code + '\')">History</button>'
      : '';
    /* Upload now stands alongside View/Download/History rather than replacing them —
       customer-owned requirements always offer a way to (re)upload, regardless of the
       current document's status. */
    var actionHtml;
    if (!r.ownedByCustomer){
      actionHtml = viewBtn + downloadBtn;
    } else {
      actionHtml = (r.doc ? viewBtn + downloadBtn : '') + uploadBtn;
    }

    var rejectReasonHtml = (r.status === 'Rejected' && r.doc && r.doc.reviewComment)
      ? '<div class="secure-req-reject-reason">' + esc(r.doc.reviewComment) + '</div>' : '';

    return '<tr><td>' + r.code + '</td><td>' + esc(r.purpose) + rejectReasonHtml + '</td>' +
      '<td>' + secureStatusPillHtml(r.status) + '</td>' +
      '<td>' + (r.doc ? esc(r.doc.version) : '<span class="secure-req-action-none">—</span>') + '</td>' +
      '<td style="text-align:right;"><div class="secure-req-action-group">' + actionHtml + historyBtn + '</div></td></tr>';
  }

  window.secureFileChosen = function(reqId, code, inputEl){
    var file = inputEl.files && inputEl.files[0];
    if (!file) return;
    var maxBytes = 10 * 1024 * 1024;
    if (file.size > maxBytes){
      rfqToast('File exceeds the 10 MB limit');
      inputEl.value = '';
      return;
    }
    secureUploadDrafts[reqId + '|' + code] = file;
    init();
  };
  window.secureCancelUpload = function(reqId, code){
    delete secureUploadDrafts[reqId + '|' + code];
    init();
  };
  window.secureConfirmUpload = function(reqId, code){
    var draftKey = reqId + '|' + code;
    var file = secureUploadDrafts[draftKey];
    if (!file) return;
    var noteEl = document.getElementById('secure-note-' + reqId + '-' + code);
    var note = noteEl ? noteEl.value.trim() : '';
    var req = getAllRequests().find(function(r){ return r.id === reqId; });
    if (!req) return;
    var stagesLen = SECURE_TYPE_STAGE_LENGTHS[req.type] || 20;
    var existing = buildSecureRequirements(req, req.type, stagesLen - 1).filter(function(r){ return r.code === code; })[0];
    var versions = (existing ? existing.versions : []).slice();
    versions.push({
      version: 'v' + (versions.length + 1),
      status: 'Under Review',
      fileName: file.name,
      uploadedBy: 'You',
      uploadedAt: new Date().toISOString(),
      changeNote: note,
      reviewComment: ''
    });
    saveSecureVersions(reqId, code, versions);
    delete secureUploadDrafts[draftKey];
    rfqToast(code + ' submitted for review.');
    init();
  };
  window.secureViewDoc = function(fileName){
    rfqToast('Viewing ' + fileName + '…');
  };
  window.secureDownloadDoc = function(fileName){
    rfqToast('Downloading ' + fileName + '…');
  };

  /* Right side panel: "Scinode Secure Vault" — a view-only, consolidated record of
     every Scinode Secure document across the whole request. The full trust-framework
     overview (pillars, encrypted collaboration, controlled access, etc.) lives in the
     Trust modal, opened on demand via the info pill rather than taking up permanent
     space in the sidebar. Appended into the existing .rfqdet-side-col flex column,
     alongside each type's own side content. */
  /* Trust Framework — replaces the old document-table "Scinode Secure Vault" panel.
     Unlike the Vault (only rendered once Secure had actually triggered for the
     request), this is always visible: it's a standing explanation of what Scinode
     Secure protects, not a record of uploaded documents — the detailed document
     list now lives in Documents > Scinode Secure (see documentsPanelV2Html). Four
     pillars are static platform guarantees; only "Legal & Governance" reflects the
     request's real state (buildSecureRequirements), since it's the one pillar with
     something for the customer to actually do. */
  var TRUST_FRAMEWORK_PILLARS = [
    { icon: ICON_LOCK, title:'Intellectual Property Protection', desc:'Protect research, technical know-how, formulations, and proprietary documentation through secure collaboration and controlled information sharing.' },
    { icon: ICON_BRIEFCASE, title:'Business & Commercial Protection', desc:'Commercial proposals, quotations, pricing discussions, and agreements remain confidential throughout engagement.' },
    { icon: ICON_USERS, title:'Controlled Collaboration', desc:'Only authorized users can access project information through role-based permissions and controlled visibility.' }
  ];

  function trustLegalStatus(req, typeKey, currentIdx){
    var requirements = buildSecureRequirements(req, typeKey, currentIdx);
    if (!requirements.length) return 'Active';
    var pending = requirements.some(function(r){ return r.ownedByCustomer && r.status !== 'Approved'; });
    return pending ? 'Agreement Required' : 'Active';
  }

  function trustStatusPillHtml(label){
    var cls = label === 'Agreement Required' ? 'warn' : label === 'Always Protected' ? 'always' : 'ok';
    var icon = cls === 'ok' ? ICON_CHECK : cls === 'always' ? ICON_SHIELD_CHECK : '';
    return '<span class="trust-pillar-status ' + cls + '">' + icon + esc(label) + '</span>';
  }

  function trustPillarRowHtml(p, statusLabel){
    return '<div class="trust-pillar">' +
      '<div class="trust-pillar-icon">' + p.icon + '</div>' +
      '<div class="trust-pillar-body">' +
        '<div class="trust-pillar-title">' + esc(p.title) + '</div>' +
        '<div class="trust-pillar-desc">' + esc(p.desc) + '</div>' +
        trustStatusPillHtml(statusLabel) +
      '</div>' +
    '</div>';
  }

  function secureRightPanelHtml(req, typeKey, currentIdx){
    var expanded = !secureVaultCollapsed;
    var toggleBtn = '<button type="button" class="secure-vault-toggle" aria-expanded="' + expanded + '" onclick="toggleSecureVault()" aria-label="' + (expanded ? 'Collapse' : 'Expand') + ' Scinode Secure Trust Framework"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>';

    var pillarsHtml = TRUST_FRAMEWORK_PILLARS.map(function(p){ return trustPillarRowHtml(p, 'Active'); }).join('') +
      trustPillarRowHtml({ icon: ICON_SCALE, title:'Legal & Governance', desc:'Maintain governed collaboration through agreements, approvals, audit history, and compliance workflows.' }, trustLegalStatus(req, typeKey, currentIdx)) +
      trustPillarRowHtml({ icon: ICON_SHIELD, title:'Platform Security', desc:'Authentication, encryption, monitoring, and infrastructure continuously protect platform data.' }, 'Always Protected');

    var bodyHtml = '<div class="trust-intro">Protecting every interaction across your collaboration lifecycle.</div>' +
      pillarsHtml;

    return '<div class="secure-req-card">' +
      '<div class="secure-req-title-row">' +
        '<div><div class="secure-req-title">Scinode Secure</div><div class="trust-eyebrow">Trust Framework</div></div>' +
        '<button type="button" class="secure-info-pill" onclick="openSecureModal()" aria-label="About Scinode Secure">' + ICON_INFO + '</button>' +
        toggleBtn +
      '</div>' +
      (secureVaultCollapsed ? '' : bodyHtml) +
    '</div>';
  }

  /* Timeline Secure Card: embedded inside a stage's accordion body, only for stages
     that introduce new Collaboration Requirements (see SECURE_STAGE_TRIGGERS). It is
     not a separate stage — appended by each type's xxxLogHtml() after its own stage body. */
  function secureCardHtml(req, typeKey, stageIdx){
    var trigger = secureTriggerAt(typeKey, stageIdx);
    if (!trigger) return '';
    var requirements = buildSecureRequirements(req, typeKey, stageIdx);
    return '<div class="secure-card">' +
      '<div class="secure-card-head">' +
        '<div class="secure-card-head-left">' + ICON_SHIELD + '<span>Scinode Secure</span>' +
          '<button type="button" class="secure-why-trigger" aria-label="Why you\'re seeing this" tabindex="0" data-why="' + esc(trigger.reason) + '">' + ICON_INFO + '</button>' +
        '</div>' +
        '<span class="secure-card-pill">' + ICON_CHECK + ' Secure Collaboration Enabled</span>' +
      '</div>' +
      '<div class="secure-card-desc">Collaborate confidently in an encrypted, permission-controlled workspace designed to protect intellectual property, formulations, technical documents, and confidential project data.</div>' +
      '<div class="secure-req-title" style="margin-top:14px;">Collaboration Requirements</div>' +
      '<table class="secure-req-table"><thead><tr><th>Requirement</th><th>Purpose</th><th>Status</th><th>Version</th><th>Actions</th></tr></thead><tbody>' +
        requirements.map(function(r){ return secureReqRowFunctionalHtml(req.id, r); }).join('') +
      '</tbody></table>' +
    '</div>';
  }

  /* "Why you're seeing this" tooltip for .secure-why-trigger — rendered into a single
     shared element on document.body (not nested in the trigger) so it isn't clipped
     by .rfqdet-card's overflow:hidden. Delegated so it works after any re-render. */
  function ensureSecureWhyTooltip(){
    var tip = document.getElementById('secure-why-tooltip');
    if (!tip){
      tip = document.createElement('div');
      tip.id = 'secure-why-tooltip';
      tip.className = 'secure-why-tip';
      tip.innerHTML = '<div class="secure-why-tip-title">Why you’re seeing this</div><div class="secure-why-tip-body" id="secure-why-tooltip-body"></div>';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function showSecureWhyTooltip(trigger){
    var tip = ensureSecureWhyTooltip();
    document.getElementById('secure-why-tooltip-body').textContent = trigger.getAttribute('data-why') || '';
    var r = trigger.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 256)) + 'px';
    tip.style.top = (r.bottom + 8) + 'px';
    tip.classList.add('open');
  }
  function hideSecureWhyTooltip(){
    var tip = document.getElementById('secure-why-tooltip');
    if (tip) tip.classList.remove('open');
  }
  document.addEventListener('mouseover', function(e){
    var t = e.target.closest && e.target.closest('.secure-why-trigger');
    if (t) showSecureWhyTooltip(t);
  });
  document.addEventListener('mouseout', function(e){
    var t = e.target.closest && e.target.closest('.secure-why-trigger');
    if (t) hideSecureWhyTooltip();
  });
  document.addEventListener('focusin', function(e){
    var t = e.target.closest && e.target.closest('.secure-why-trigger');
    if (t) showSecureWhyTooltip(t);
  });
  document.addEventListener('focusout', function(e){
    var t = e.target.closest && e.target.closest('.secure-why-trigger');
    if (t) hideSecureWhyTooltip();
  });

  /* Trust modal content is request-independent (same for every type/page), so it's
     rendered once into the static #secure-modal shell rather than per detail-render. */
  function renderSecureModalContent(){
    var body = document.getElementById('secure-modal-body');

    var pillarCards = SECURE_PILLARS.map(function(p, i){
      return '<div class="tc2-card' + (i === SECURE_PILLARS.length - 1 ? ' tc2-card-full' : '') + '">' +
        '<div class="tc2-card-head"><span class="tc2-ico">' + SECURE_PILLAR_ICONS[p.code] + '</span><div class="tc2-card-title">' + esc(p.title) + '</div></div>' +
        '<div class="tc2-card-desc">' + esc(p.desc) + '</div>' +

    body.innerHTML =
      '<div class="tc2-ribbon">' + ICON_SHIELD + ' Scinode Secure — Trust Framework Active</div>' +
      '<div class="tc2-head-row">' +
        '<span class="tc2-shield">' + ICON_SHIELD + '</span>' +
        '<div><div class="tc2-identity-label">Scinode Secure</div><div class="modal-title" id="secure-modal-title">Secure Every Collaboration.</div></div>' +
      '</div>' +
      '<div class="tc2-intro">Encrypted collaboration and governed access protect your intellectual property, technical documents, and project data throughout every stage of collaboration.</div>' +
      '<hr class="tc2-divider">' +
      '<div class="tc2-eyebrow">Category &amp; Description</div>' +
      '<div class="tc2-grid">' + pillarCards + '</div>' +
      '<div class="tc2-footer"><span class="tc2-powered">' + ICON_SHIELD + ' Powered by Scinode Secure</span></div>';
  }
  renderSecureModalContent();

  function rfqQuoteRoundsFor(req){ return req.rfqQuoteRounds || (req.rfq && req.rfq.quoteRounds) || []; }

  function rfqDocRow(name, size, actionLabel){
    return '<div class="rfqdet-doc-row"><div class="rfqdet-doc-icon">' + ICON_DOC + '</div>' +
      '<div><div class="rfqdet-doc-name">' + esc(name) + '</div><div class="rfqdet-doc-size">' + esc(size || '') + '</div></div>' +
      '<button type="button" class="rfqdet-doc-action" onclick="rfqToast(\'Opening ' + esc(name).replace(/'/g,"\\'") + '…\')">' + (actionLabel || 'View') + '</button>' +
    '</div>';
  }

  function rfqQuoteCardHtml(req, round, opts){
    opts = opts || {};
    var expiry = new Date(new Date(req.lastUpdated + 'T00:00:00').getTime() + (round.validityDays||7)*86400000);
    var expiryStr = formatDate(expiry.toISOString().slice(0,10));
    var fields = [
      ['Quantity', round.quantity], ['Inco Terms', round.incoTerms], ['Payment Terms', round.paymentTerms],
      ['Port Name', round.portName], ['Packaging', round.packaging], ['Lead Time', round.leadTime]
    ];
    var gridHtml = fields.map(function(f){
      return '<div><div class="rfqdet-quote-field-label">' + f[0] + '</div><div class="rfqdet-quote-field-val">' + esc(f[1]) + '</div></div>';
    }).join('');
    var actionsHtml = '';
    if (opts.showActions){
      var scimplifyRounds = rfqQuoteRoundsFor(req).filter(function(r){ return r.from === 'scimplify'; });
      var canAskAgain = scimplifyRounds.length < MAX_NEGOTIATION_ROUNDS;
      actionsHtml = '<div class="rfqdet-quote-expiry">Scimplify Price Expires on<b>' + expiryStr + '</b></div>' +
        '<div class="rfqdet-quote-actions">' +
          '<span class="rfqdet-quote-validity">Price Validity: ' + (round.validityDays||7) + ' days</span>' +
          '<span style="display:flex;gap:8px;">' +
            (canAskAgain ? '<button type="button" class="rfqdet-btn rfqdet-btn-secondary" onclick="rfqAskAnotherQuote(\'' + req.id + '\')">Ask for another quote</button>' : '') +
            '<button type="button" class="rfqdet-btn rfqdet-btn-primary" onclick="rfqAcceptQuote(\'' + req.id + '\')">Accept This Quote</button>' +
          '</span>' +
        '</div>';
    }
    return '<div class="rfqdet-quote-card">' +
      '<div class="rfqdet-quote-price"><div class="rfqdet-quote-price-label">Scimplify Price</div>' +
        '<div class="rfqdet-quote-price-val">$' + round.price.toFixed(2) + ' ' + round.unit + '</div>' +
        '<div class="rfqdet-quote-price-sub">Price Validity: ' + (round.validityDays||7) + ' Days</div></div>' +
      '<div><div class="rfqdet-quote-field-label">Product Name</div><div class="rfqdet-quote-name">' + esc(round.productName) + '</div></div>' +
      '<div class="rfqdet-quote-grid">' + gridHtml + '</div>' +
      actionsHtml +
    '</div>';
  }

  function rfqNegotiationHtml(req, currentIdx){
    var rounds = rfqQuoteRoundsFor(req);
    var active = currentIdx === 2;
    var html = rounds.map(function(r, i){
      var isLastScimplify = r.from === 'scimplify' && i === rounds.length - 1;
      if (active && isLastScimplify){
        return '<div>' +
          '<div class="rfqdet-neg-row" style="margin-bottom:8px;"><div><div class="rfqdet-neg-label">Quotation from Scimplify' + (r.round > 0 ? ' (Revised)' : '') + '</div><div class="rfqdet-neg-date">' + esc(formatDate(req.lastUpdated)) + '</div></div>' + (r.round > 0 ? '<span class="rfqdet-neg-badge">New quote available</span>' : '') + '</div>' +
          rfqQuoteCardHtml(req, r, { showActions: true }) +
        '</div>';
      }
      if (r.from === 'scimplify'){
        return '<div class="rfqdet-neg-row"><div class="rfqdet-neg-label">' + (r.round === 0 ? 'Quotation from Scimplify' : 'Revised Quotation from Scimplify') + '</div><div class="rfqdet-neg-date">' + esc(formatDate(req.lastUpdated)) + '</div></div>';
      }
      return '<div class="rfqdet-neg-row"><div class="rfqdet-neg-label">Revised quotation requested by me</div><div class="rfqdet-neg-date">' + esc(formatDate(req.lastUpdated)) + '</div></div>';
    }).join('<div style="height:8px;"></div>');
    return '<div style="display:flex;flex-direction:column;gap:8px;">' + html + '</div>';
  }

  function rfqStageBodyHtml(req, i, currentIdx){
    var rounds = rfqQuoteRoundsFor(req);
    var lastRound = rounds.filter(function(r){ return r.from === 'scimplify'; }).slice(-1)[0];
    switch (i){
      case 0: /* Requirement Submitted */
        return rfqDocRow(req.rfq.uploadedDoc.name, req.rfq.uploadedDoc.size) +
          '<div class="rfqdet-alert rfqdet-alert-done"><span>' + ICON_CHECK + '</span><div>Your Scimplify Representative, <strong>' + esc(req.expert.name) + '</strong>, has been assigned to your request.</div></div>';
      case 1: /* Under Sourcing */
        return '<div class="rfqdet-alert rfqdet-alert-info"><span>' + ICON_FILE_CLOCK + '</span><div>' + esc(req.rfq.sourcingNote) + '</div></div>';
      case 2: /* Quotation Received */
        return rfqNegotiationHtml(req, currentIdx);
      case 3: /* Quotation Accepted */
        return lastRound ? rfqQuoteCardHtml(req, lastRound, { showActions: false }) : '';
      case 4: /* Upload Purchase Order */
        if (currentIdx === 4){
          return '<div class="rfqdet-quote-expiry" style="margin-bottom:2px;">Order Deadline (To Upload PO)<b>' + formatDate(new Date(new Date(req.lastUpdated+'T00:00:00').getTime() + (req.rfq.poDeadlineDays||21)*86400000).toISOString().slice(0,10)) + '</b></div>' +
            '<div class="rfqdet-po-form">' +
              '<div><label class="rfqdet-po-label">Enter PO Number</label><input type="text" class="rfqdet-po-input" id="rfqdet-po-input" placeholder="e.g. PO-2026-4471"></div>' +
              '<div><label class="rfqdet-po-label">Upload Purchase Order</label><input type="file" class="rfqdet-po-file" id="rfqdet-po-file"></div>' +
              '<div><button type="button" class="rfqdet-btn rfqdet-btn-primary" onclick="rfqPlaceOrder(\'' + req.id + '\')">Place Order</button></div>' +
            '</div>';
        }
        return req.rfqPO ? rfqDocRow(req.rfqPO.fileName, 'PO Number: ' + req.rfqPO.number, 'View') : '';
      case 5: /* RFQ Closed */
        return rfqDocRow(req.rfq.invoiceName, 'Download Performa Invoice', 'Download') +
          '<div class="rfqdet-confirm-panel">' +
            '<div class="rfqdet-confirm-title">Order confirmed</div>' +
            '<div class="rfqdet-confirm-sub">Purchase Order ID: ' + esc((req.rfqPO && req.rfqPO.number) || req.id) + '. Your Order is Confirmed.</div>' +
            '<button type="button" class="rfqdet-btn rfqdet-btn-primary" onclick="rfqToast(\'You are all caught up on this request.\')">Track your Order here</button>' +
          '</div>';
      default:
        return '';
    }
  }

  function rfqLogHtml(req){
    var currentIdx = stageIndexFor(req.progress, RFQ_LOG_STAGES.length);
    return renderStageAccordion(RFQ_LOG_STAGES, currentIdx, req.lastUpdated, function(i, idx){
      return rfqStageBodyHtml(req, i, idx) + secureCardHtml(req, 'RFQ', i);
    }, 'RFQ');
  }

  function rfqSideHtml(req){

      '<div class="rfqdet-rep-card">' +

        '<div class="rfqdet-field"><div class="rfqdet-field-label">Name</div><div class="rfqdet-field-value">' + esc(req.expert.name) + '</div></div>' +
        '<div class="rfqdet-field"><div class="rfqdet-field-label">Role</div><div class="rfqdet-field-value">' + esc(req.expert.title) + '</div></div>' +
      '</div>' +

  /* ── Documents tab (global request document library) ─────────────────────
     Purely additive, gated by the "Documents Tab" demo toggle in .rfqdet-toprow
     (DOCS_TAB_MODE below). When off, renderDetailCard renders exactly as before
     (no tab bar, logHtml goes straight into .rfqdet-body) — the "Classic View"
     kept for demo/comparison purposes per explicit request. Intentionally
     separate from Scinode Secure (buildSecureRequirements/secureRightPanelHtml):
     this is the general document library, never NDA/NCDS/MSA. */
  var DOCS_TAB_MODE = (function(){
    try { return localStorage.getItem('scinodeDocsTabMode') === '1'; } catch (e){ return false; }
  })();

  window.setDocsTabMode = function(on){
    DOCS_TAB_MODE = on;
    try { localStorage.setItem('scinodeDocsTabMode', on ? '1' : '0'); } catch (e){ /* storage unavailable */ }
    updateDocsToggleUI();
    init();
  };

  function updateDocsToggleUI(){
    var c = document.getElementById('rfqdet-layout-classic');
    var n = document.getElementById('rfqdet-layout-new');
    if (!c || !n) return;
    c.classList.toggle('active', !DOCS_TAB_MODE);
    c.setAttribute('aria-selected', String(!DOCS_TAB_MODE));
    n.classList.toggle('active', DOCS_TAB_MODE);
    n.setAttribute('aria-selected', String(DOCS_TAB_MODE));
  }

  window.rfqdetSwitchDocTab = function(name, btn){
    switchTab(btn);
    ['journey', 'documents'].forEach(function(n){
      var p = document.getElementById('rfqdet-panel-' + n);
      if (p) p.classList.toggle('active', n === name);
    });
  };

  function docTypeIconHtml(ext){
    return '<div class="rfqdet-doc-icon2 ' + ext + '">' + ICON_DOC + '</div>';
  }

  window.rfqdetFilterDocs = function(reqId, query){
    flatSearchQuery = query;
    renderFlatDocsTbody();
  };

  /* Documents-tab UI compare (demo toggle, separate from the Level-1 Classic/Documents
     toggle): "Flat List" is the original single-list Documents view (unchanged below,
     just renamed); "Categorized" is the new All/Request/Product/Scinode Secure
     second-level nav. Persisted like the other demo toggles so a refresh keeps it. */
  var DOCS_V2_MODE = (function(){
    try { return localStorage.getItem('scinodeDocsV2Mode') === '1'; } catch (e){ return false; }
  })();
  window.setDocsV2Mode = function(on){
    DOCS_V2_MODE = on;
    try { localStorage.setItem('scinodeDocsV2Mode', on ? '1' : '0'); } catch (e){ /* storage unavailable */ }
    init();
  };
  function docsUiToggleHtml(){
    return '<div class="sbv-toggle" role="tablist" aria-label="Documents UI compare" title="Categorized documents (new) vs. flat list — demo comparison, not a saved preference">' +
      '<button type="button" role="tab" id="rfqdet-docsui-flat" aria-selected="' + (!DOCS_V2_MODE) + '" class="' + (DOCS_V2_MODE ? '' : 'active') + '" onclick="setDocsV2Mode(false)">Flat List</button>' +
      '<button type="button" role="tab" id="rfqdet-docsui-v2" aria-selected="' + (!!DOCS_V2_MODE) + '" class="' + (DOCS_V2_MODE ? 'active' : '') + '" onclick="setDocsV2Mode(true)">Categorized</button>' +
    '</div>';
