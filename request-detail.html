  function documentsPanelHtml(req, secureCurrentIdx){
    return DOCS_V2_MODE ? documentsPanelV2Html(req, secureCurrentIdx) : documentsPanelFlatHtml(req, secureCurrentIdx);
  }

  /* "Flat List" sources the exact same catalog (Request + Product + Scinode Secure)
     as the Categorized view's "All Documents" — same documents, same category
     badges — just without the second-level category nav above it. */
  function documentsPanelFlatHtml(req, secureCurrentIdx){
    var catalog = buildDocumentCatalog(req, secureCurrentIdx);
    docsCatalogCache = catalog;
    flatCategoryFilter = 'all';
    flatSearchQuery = '';
    var docs = flattenDocumentCatalog(catalog);
    var n = docs.length;
    var head = '<div class="rfqdet-docs-head">' +
        '<div class="rfqdet-docs-head-row">' +
          '<div>' +
            '<div class="rfqdet-docs-title">Documents</div>' +
            '<div class="rfqdet-docs-sub">All documents related to this request, product, and secure collaboration.</div>' +
            (n ? '<div class="rfqdet-docs-count">' + n + (n === 1 ? ' document' : ' documents') + ' shared for this request</div>' : '') +
          '</div>' +
          docsUiToggleHtml() +
        '</div>' +
      '</div>';
    if (!n){
      return '<div class="rfqdet-docs-panel">' + head +
        '<div class="rfqdet-docs-empty">' + ICON_FOLDER_OPEN +
          '<div class="rfqdet-docs-empty-title">No documents available yet.</div>' +
          '<div class="rfqdet-docs-empty-sub">Documents related to this request will appear here.</div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="rfqdet-docs-panel">' + head +
      '<div class="rfqdet-docs-controls">' +
        '<div class="rfqdet-docs-search">' + ICON_SEARCH + '<input type="text" placeholder="Search documents" oninput="rfqdetFilterDocs(\'' + esc(req.id) + '\', this.value)"></div>' +
        '<div class="rfqdet-docs-sort">' + ICON_SORT + '<span>Newest first</span></div>' +
      '</div>' +
      '<div class="rfqdet-docs-table-card"><div class="rfqdet-docs-table-wrap"><table class="secure-req-table rfqdet-docs-table"><thead><tr><th>Document</th><th id="rfqdet-cat-th">' + flatCategoryHeaderHtml() + '</th><th>Type</th><th>Shared on</th><th>Shared by</th><th></th></tr></thead>' +
        '<tbody id="rfqdet-docs-tbody">' + docs.map(flatDocRowHtml).join('') + '</tbody>' +
      '</table></div></div>' +
    '</div>';
  }

  /* ── Categorized Documents view (new, "Level 2" nav: All / Request / Product /
     Scinode Secure) ──────────────────────────────────────────────────────────────
     docsCatalogCache + docsActiveCategory are module state so category switching and
     search filtering can just rebuild #rfqdet-docs-list-area, the same lightweight
     pattern as rfqdetFilterDocs above — no full init() re-render mid-interaction. */
  var docsCatalogCache = null;
  var docsActiveCategory = 'all';

  /* Flat List's own Category-column filter (separate from docsActiveCategory above,
     which drives the Categorized view's Level-2 nav tabs). Reset to 'all' every time
     documentsPanelFlatHtml renders. */
  var flatCategoryFilter = 'all';
  var flatSearchQuery = '';
  var FLAT_CATEGORY_OPTIONS = [
    { value:'all', label:'All' },
    { value:'product', label:'Product' },
    { value:'request', label:'Request' },
    { value:'secure', label:'Scinode Secure' }
  ];

  function flatDocRowHtml(d){
    var newBadge = d.isNew ? '<span class="rfqdet-doc-new-badge">New</span>' : '';
    var statusBadge = d.secureStatus ? secureStatusPillHtml(d.secureStatus) : '';
    return '<tr>' +
      '<td><div class="rfqdet-doc-cell">' + docTypeIconHtml(d.ext) +
        '<span class="rfqdet-doc-name" title="' + esc(d.name) + '">' + esc(d.name) + '</span>' +
        statusBadge + newBadge +
      '</div></td>' +
      '<td>' + catalogCategoryBadgeHtml(d.category) + '</td>' +
      '<td>' + esc(d.type) + '</td>' +
      '<td>' + esc(relativeShareLabel(d.sharedOnDate)) + '</td>' +
      '<td>' + esc(d.sharedBy) + '</td>' +
      '<td style="text-align:right;"><div class="secure-req-action-group">' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureViewDoc(\'' + esc(d.name) + '\')">View</button>' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureDownloadDoc(\'' + esc(d.name) + '\')">Download</button>' +
      '</div></td>' +
    '</tr>';
  }

  function flatCategoryHeaderHtml(){
    var current = FLAT_CATEGORY_OPTIONS.filter(function(o){ return o.value === flatCategoryFilter; })[0];
    var opts = FLAT_CATEGORY_OPTIONS.map(function(o){
      return '<button type="button" class="rfqdet-catcol-opt' + (o.value === flatCategoryFilter ? ' active' : '') + '" onclick="rfqdetSetCategoryFilter(\'' + o.value + '\')">' + esc(o.label) + (o.value === flatCategoryFilter ? ICON_CHECK : '') + '</button>';
    }).join('');
    return '<div class="rfqdet-catcol-wrap">' +
      '<button type="button" class="rfqdet-catcol-head" onclick="rfqdetToggleCatMenu(event)">Category' + (flatCategoryFilter !== 'all' ? ': ' + esc(current.label) : '') + ICON_CHEVRON + '</button>' +
      '<div class="rfqdet-catcol-menu" id="rfqdet-catcol-menu">' + opts + '</div>' +
    '</div>';
  }

  window.rfqdetToggleCatMenu = function(e){
    e.stopPropagation();
    var menu = document.getElementById('rfqdet-catcol-menu');
    if (menu) menu.classList.toggle('open');
  };

  function closeCatFilterMenu(){
    var menu = document.getElementById('rfqdet-catcol-menu');
    if (menu) menu.classList.remove('open');
  }

  document.addEventListener('click', function(e){
    if (!e.target.closest || !e.target.closest('.rfqdet-catcol-wrap')) closeCatFilterMenu();
  });

  function renderFlatDocsTbody(){
    var tbody = document.getElementById('rfqdet-docs-tbody');
    if (!tbody || !docsCatalogCache) return;
    var q = flatSearchQuery.trim().toLowerCase();
    var docs = flattenDocumentCatalog(docsCatalogCache);
    if (flatCategoryFilter !== 'all') docs = docs.filter(function(d){ return d.category === flatCategoryFilter; });
    var filtered = q ? docs.filter(function(d){ return d.name.toLowerCase().indexOf(q) !== -1; }) : docs;
    tbody.innerHTML = filtered.length
      ? filtered.map(flatDocRowHtml).join('')
      : '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:22px 0;">No documents match your filters.</td></tr>';
    var headCell = document.getElementById('rfqdet-cat-th');
    if (headCell) headCell.innerHTML = flatCategoryHeaderHtml();
  }

  window.rfqdetSetCategoryFilter = function(cat){
    flatCategoryFilter = cat;
    closeCatFilterMenu();
    renderFlatDocsTbody();
  };

  function catalogCategoryBadgeHtml(category){
    var meta = { request:{ label:'Request', cls:'request' }, product:{ label:'Product', cls:'product' }, secure:{ label:'Scinode Secure', cls:'secure' } }[category];
    return meta ? '<span class="rfqdet-cat-badge ' + meta.cls + '">' + esc(meta.label) + '</span>' : '';
  }

  function catalogRowHtml(d, showCategoryBadge){
    var newBadge = d.isNew ? '<span class="rfqdet-doc-new-badge">New</span>' : '';
    var catBadge = showCategoryBadge ? catalogCategoryBadgeHtml(d.category) : '';
    var statusBadge = d.secureStatus ? secureStatusPillHtml(d.secureStatus) : '';
    return '<tr>' +
      '<td><div class="rfqdet-doc-cell">' + docTypeIconHtml(d.ext) +
        '<span class="rfqdet-doc-name" title="' + esc(d.name) + '">' + esc(d.name) + '</span>' +
        catBadge + statusBadge + newBadge +
      '</div></td>' +
      '<td>' + esc(d.type) + '</td>' +
      '<td>' + esc(relativeShareLabel(d.sharedOnDate)) + '</td>' +
      '<td>' + esc(d.sharedBy) + '</td>' +
      '<td style="text-align:right;"><div class="secure-req-action-group">' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureViewDoc(\'' + esc(d.name) + '\')">View</button>' +
        '<button type="button" class="secure-req-action secure-req-action-ghost" onclick="secureDownloadDoc(\'' + esc(d.name) + '\')">Download</button>' +
      '</div></td>' +
    '</tr>';
  }

  function catalogTableCardHtml(rows, showCategoryBadge){
    if (!rows.length) return '';
    return '<div class="rfqdet-docs-table-card"><div class="rfqdet-docs-table-wrap"><table class="secure-req-table rfqdet-docs-table"><thead><tr><th>Document</th><th>Type</th><th>Shared on</th><th>Shared by</th><th></th></tr></thead><tbody>' +
      rows.map(function(r){ return catalogRowHtml(r, showCategoryBadge); }).join('') +
    '</tbody></table></div></div>';
  }

  function catalogEmptyHtml(title, sub, extraHtml){
    return '<div class="rfqdet-docs-empty">' + ICON_FOLDER_OPEN +
      '<div class="rfqdet-docs-empty-title">' + esc(title) + '</div>' +
      (sub ? '<div class="rfqdet-docs-empty-sub">' + esc(sub) + '</div>' : '') +
      (extraHtml || '') +
    '</div>';
  }

  function docsSubgroupHtml(title, rows, actionHtml, emptyTitle, emptySub){
    var head = '<div class="rfqdet-docs-subgroup-head"><span class="rfqdet-docs-subgroup-title">' + esc(title) + '</span>' + (actionHtml || '') + '</div>';
    var body = rows.length ? catalogTableCardHtml(rows, false) : catalogEmptyHtml(emptyTitle || '', emptySub || '');
    return '<div class="rfqdet-docs-subgroup">' + head + body + '</div>';
  }

  function docsMatchesQuery(d, q){
    return !q || d.name.toLowerCase().indexOf(q) !== -1;
  }

  function docsCategoryBodyHtml(catalog, category, query){
    var q = (query || '').trim().toLowerCase();
    if (category === 'product'){
      var prod = catalog.product.filter(function(d){ return docsMatchesQuery(d, q); });
      if (!prod.length) return catalogEmptyHtml(q ? 'No documents match your search.' : 'No product documents available yet.', q ? '' : 'Product documents shared by Scinode will appear here.');
      return catalogTableCardHtml(prod, false);
    }
    if (category === 'secure'){
      var sec = catalog.secure.filter(function(d){ return docsMatchesQuery(d, q); });
      var uploadBtn = '<button type="button" class="mfg-btn-secondary rfqdet-docs-upload-btn" onclick="rfqdetDemoUpload(\'Secure Document\')">Upload Secure Document</button>';
      if (!sec.length){
        return catalogEmptyHtml(q ? 'No documents match your search.' : 'No secure documents available yet.', q ? '' : 'Secure documents shared or uploaded for this request will appear here.', q ? '' : '<div class="rfqdet-docs-cta-row">' + uploadBtn + '</div>');
      }
      return '<div class="rfqdet-docs-cta-row">' + uploadBtn + '</div>' + catalogTableCardHtml(sec, false);
    }
    if (category === 'request'){
      var totalReq = catalog.request.proposal.length + catalog.request.meeting.length + catalog.request.po.length;
      if (!totalReq) return catalogEmptyHtml('No request documents available yet.', 'Documents shared during the progress of this request will appear here.');
      var proposal = catalog.request.proposal.filter(function(d){ return docsMatchesQuery(d, q); });
      var meeting = catalog.request.meeting.filter(function(d){ return docsMatchesQuery(d, q); });
      var po = catalog.request.po.filter(function(d){ return docsMatchesQuery(d, q); });
      var poUploadBtn = '<button type="button" class="mfg-btn-secondary rfqdet-docs-upload-btn-sm" onclick="rfqdetDemoUpload(\'Purchase Order\')">Upload PO</button>';
      var groups = '';
      if (proposal.length) groups += docsSubgroupHtml('Commercial Proposal', proposal);
      if (meeting.length) groups += docsSubgroupHtml('Meeting Notes', meeting);
      if (po.length || !q){
        groups += docsSubgroupHtml('Purchase Orders', po, poUploadBtn, 'No purchase orders uploaded yet.', 'You can upload a purchase order when it is ready.');
      }
      if (!groups) groups = catalogEmptyHtml('No documents match your search.', '');
      return '<div class="rfqdet-docs-request-groups">' + groups + '</div>';
    }
    /* 'all' */
    var flat = flattenDocumentCatalog(catalog).filter(function(d){ return docsMatchesQuery(d, q); });
    if (!flat.length) return catalogEmptyHtml(q ? 'No documents match your search.' : 'No documents available yet.', q ? '' : 'Documents related to this request will appear here.');
    return catalogTableCardHtml(flat, true);
  }

  function renderDocsListArea(query){
    var area = document.getElementById('rfqdet-docs-list-area');
    if (!area || !docsCatalogCache) return;
    area.innerHTML = docsCategoryBodyHtml(docsCatalogCache, docsActiveCategory, query);
  }

  window.rfqdetSwitchDocsCategory = function(cat, btn){
    docsActiveCategory = cat;
    switchTab(btn);
    var input = document.getElementById('rfqdet-docs-search-input');
    if (input) input.value = '';
    renderDocsListArea('');
  };

  window.rfqdetFilterCatalog = function(value){
    renderDocsListArea(value);
  };

  /* No persistence layer behind Purchase Order / Secure Document uploads in this
     categorized demo view — a real file picker opens and a toast confirms the pick,
     same fidelity as the existing secureViewDoc/secureDownloadDoc stubs elsewhere on
     this page. The real, persisted Secure upload/review workflow (versions, statuses,
     change notes) is untouched — it still lives on the Request Journey timeline and
     the Scinode Secure Vault. */
  window.rfqdetDemoUpload = function(kind){
    var input = document.createElement('input');
    input.type = 'file';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      document.body.removeChild(input);
      if (file) rfqToast(file.name + ' uploaded as ' + kind + ' (demo).');
    });
    input.click();
  };

  function documentsPanelV2Html(req, secureCurrentIdx){
    var catalog = buildDocumentCatalog(req, secureCurrentIdx);
    docsCatalogCache = catalog;
    docsActiveCategory = 'all';
    var counts = documentCatalogCounts(catalog);
    var head = '<div class="rfqdet-docs-head">' +
        '<div class="rfqdet-docs-head-row">' +
          '<div>' +
            '<div class="rfqdet-docs-title">Documents</div>' +
            '<div class="rfqdet-docs-sub">All documents related to this request, product, and secure collaboration.</div>' +
          '</div>' +
          docsUiToggleHtml() +
        '</div>' +
      '</div>';
    var catnav = '<div class="rfqdet-docs-catnav" role="tablist" aria-label="Document category">' +
        '<button type="button" class="rfqdet-catnav-btn active" role="tab" aria-selected="true" onclick="rfqdetSwitchDocsCategory(\'all\',this)">All Documents <span class="rfqdet-catnav-count">' + counts.all + '</span></button>' +
        '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="rfqdetSwitchDocsCategory(\'request\',this)">Request <span class="rfqdet-catnav-count">' + counts.request + '</span></button>' +
        '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="rfqdetSwitchDocsCategory(\'product\',this)">Product <span class="rfqdet-catnav-count">' + counts.product + '</span></button>' +
        '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="rfqdetSwitchDocsCategory(\'secure\',this)"><span class="rfqdet-catnav-shield">' + ICON_SHIELD_CHECK + '</span>Scinode Secure <span class="rfqdet-catnav-count">' + counts.secure + '</span></button>' +
      '</div>';
    var controls = '<div class="rfqdet-docs-controls">' +
        '<div class="rfqdet-docs-search">' + ICON_SEARCH + '<input type="text" id="rfqdet-docs-search-input" placeholder="Search documents" oninput="rfqdetFilterCatalog(this.value)"></div>' +
        '<div class="rfqdet-docs-sort">' + ICON_SORT + '<span>Newest first</span></div>' +
      '</div>';
    var listArea = '<div id="rfqdet-docs-list-area">' + docsCategoryBodyHtml(catalog, 'all', '') + '</div>';

  /* ── Documents sidebar card + drawer (Classic View only) ──────────────────
     Additive entry point, per spec: the right-rail card only ever communicates
     "everything is here" (count + category summary) — it never renders the
     document list itself. Clicking "View all documents" opens the drawer,
     which is where the actual browsing happens; reuses the exact same catalog
     builder and row/table/empty-state renderers as the Documents Tab
     experiment above (buildDocumentCatalog, flattenDocumentCatalog,
     catalogTableCardHtml, docsCategoryBodyHtml, catalogEmptyHtml) so there is
     one source of truth for what a document list looks like. Kept on its own
     local state (not DOCS_V2_MODE/setDocsV2Mode) so toggling Flat/Categorized
     inside the drawer never triggers the page's full init(). */
  var docsDrawerCatalog = null, docsDrawerMode = 'flat', docsDrawerCategory = 'all', docsDrawerSearch = '';
  var ICON_ARROW_SM = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  /* The mock catalog generator always produces several documents (proposal +
     meeting notes + PO + product docs), so a real zero-document request never
     occurs in this demo data — the sidebar card's empty state would otherwise
     be unreachable. DOCS_CARD_DEMO_STATE is a "force empty" preview toggle on
     the Classic card layout (same demo-toggle pattern as DOCS_TAB_MODE/
     DOCS_V2_MODE above) so both states can be reviewed side by side. Only
     the Classic layout has an empty-state treatment — Vault/Analytics were
     supplied as populated-state mockups only. */
  var DOCS_CARD_DEMO_STATE = (function(){
    try { return localStorage.getItem('scinodeDocsCardDemo') === 'empty' ? 'empty' : 'data'; } catch (e){ return 'data'; }
  })();
  window.setDocsCardDemoState = function(state){
    DOCS_CARD_DEMO_STATE = state;
    try { localStorage.setItem('scinodeDocsCardDemo', state); } catch (e){ /* storage unavailable */ }
    init();
  };

  /* Three sidebar-card layout concepts, kept side by side for comparison —
     Classic (original), Vault ("Restricted Request Vault" mockup) and
     Analytics ("Provenance Analytics" donut mockup). DOCS_CARD_LAYOUT picks
     which one renders; all three read the same live counts, so none of them
     hardcode the mockups' own "7" example figure. */
  var DOCS_CARD_LAYOUT = (function(){
    try { var v = localStorage.getItem('scinodeDocsCardLayout'); return (v === 'vault' || v === 'analytics') ? v : 'classic'; } catch (e){ return 'classic'; }
  })();
  window.setDocsCardLayout = function(layout){
    DOCS_CARD_LAYOUT = layout;
    try { localStorage.setItem('scinodeDocsCardLayout', layout); } catch (e){ /* storage unavailable */ }
    init();
  };
  var ICON_LOCK_SM = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var ICON_LOCK_MD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var ICON_PIE_SM = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>';
  var ICON_ARROW_SM_WHITE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function documentsCardLayoutToggleHtml(){
    return '<div class="rfqdet-docs-layout-toggle">' +
      '<span class="rfqdet-docs-layout-toggle-label">Card style</span>' +
      '<div class="sbv-toggle" role="tablist" aria-label="Documents card layout" title="Three layout concepts — demo comparison, not a saved preference">' +
        '<button type="button" role="tab" aria-selected="' + (DOCS_CARD_LAYOUT === 'classic') + '" class="' + (DOCS_CARD_LAYOUT === 'classic' ? 'active' : '') + '" onclick="setDocsCardLayout(\'classic\')">Classic</button>' +
        '<button type="button" role="tab" aria-selected="' + (DOCS_CARD_LAYOUT === 'vault') + '" class="' + (DOCS_CARD_LAYOUT === 'vault' ? 'active' : '') + '" onclick="setDocsCardLayout(\'vault\')">Vault</button>' +
        '<button type="button" role="tab" aria-selected="' + (DOCS_CARD_LAYOUT === 'analytics') + '" class="' + (DOCS_CARD_LAYOUT === 'analytics' ? 'active' : '') + '" onclick="setDocsCardLayout(\'analytics\')">Analytics</button>' +
      '</div>' +
    '</div>';
  }

  function documentsCardClassicHtml(secureCurrentIdx, counts){
    var forcedEmpty = DOCS_CARD_DEMO_STATE === 'empty';
    var isEmpty = forcedEmpty || counts.all === 0;
    var demoToggle = '<div class="rfqdet-docs-card-demo">' +
        '<span class="rfqdet-docs-card-demo-label">Preview</span>' +
        '<div class="sbv-toggle" role="tablist" aria-label="Documents card preview state" title="Has documents vs. empty state — demo comparison, not a saved preference">' +
          '<button type="button" role="tab" aria-selected="' + !forcedEmpty + '" class="' + (forcedEmpty ? '' : 'active') + '" onclick="setDocsCardDemoState(\'data\')">Documents</button>' +
          '<button type="button" role="tab" aria-selected="' + forcedEmpty + '" class="' + (forcedEmpty ? 'active' : '') + '" onclick="setDocsCardDemoState(\'empty\')">Empty state</button>' +
        '</div>' +
      '</div>';
    var content = isEmpty
      ? '<div class="rfqdet-docs-card-empty">' + ICON_FOLDER_OPEN +
          '<div class="rfqdet-docs-card-empty-title">No documents yet</div>' +
          '<div class="rfqdet-docs-card-empty-sub">Documents related to this request will appear here as they are shared.</div>' +
        '</div>'
      : '<div class="rfqdet-docs-card-sub">All documents related to this request, in one place.</div>' +
        '<div class="rfqdet-docs-card-meta">' +
          '<span class="rfqdet-docs-card-count">' + counts.all + (counts.all === 1 ? ' document' : ' documents') + '</span>' +

        '</div>' +
        '<button type="button" class="rfqdet-docs-card-cta" onclick="openDocumentsDrawer(' + secureCurrentIdx + ')">View all documents ' + ICON_ARROW_SM + '</button>';

  /* "Restricted Request Vault" mockup. */
  function documentsCardVaultHtml(secureCurrentIdx, counts){
    return '<div class="rfqdet-info-card rfqdet-docs-vault">' +
      '<div class="rfqdet-docs-vault-head">' +

        '<span class="rfqdet-docs-vault-cta-left">' + ICON_LOCK_SM + '<span>Open Document Vault (' + counts.all + ')</span></span>' +
        ICON_ARROW_SM_WHITE +
      '</button>' +
    '</div>';

  /* "Provenance Analytics" donut mockup. */
  function documentsCardAnalyticsHtml(secureCurrentIdx, counts){
    var total = counts.all || 1;
    var R = 40, C = Math.round(2 * Math.PI * R);
    var reqLen = C * counts.request / total, prodLen = C * counts.product / total, secLen = C * counts.secure / total;
    var pct = function(n){ return Math.round(n / total * 100); };
    var donut = '<svg viewBox="0 0 100 100" width="120" height="120" class="rfqdet-docs-analytics-donut">' +
        '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--page-bg)" stroke-width="12"/>' +
        '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--teal-600)" stroke-width="12" stroke-dasharray="' + reqLen + ' ' + C + '" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 50 50)"/>' +
        '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--teal-300)" stroke-width="12" stroke-dasharray="' + prodLen + ' ' + C + '" stroke-dashoffset="' + (-reqLen) + '" stroke-linecap="round" transform="rotate(-90 50 50)"/>' +
        '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--navy-900)" stroke-width="12" stroke-dasharray="' + secLen + ' ' + C + '" stroke-dashoffset="' + (-(reqLen + prodLen)) + '" stroke-linecap="round" transform="rotate(-90 50 50)"/>' +
      '</svg>';
    function row(dotClass, label, n){
      return '<div class="rfqdet-docs-analytics-row"><span class="rfqdet-docs-analytics-dot ' + dotClass + '"></span><span class="rfqdet-docs-analytics-label">' + label + '</span><span class="rfqdet-docs-analytics-val">' + n + ' <span class="pct">(' + pct(n) + '%)</span></span></div>';
    }
    return '<div class="rfqdet-info-card rfqdet-docs-analytics">' +
      '<div class="rfqdet-docs-analytics-head">' +
        '<div><div class="rfqdet-docs-analytics-title">Documents</div><div class="rfqdet-docs-analytics-subtitle">Provenance Analytics</div></div>' +
        '<span class="rfqdet-docs-analytics-badge">' + ICON_PIE_SM + 'Macro View</span>' +
      '</div>' +
      '<div class="rfqdet-docs-analytics-ring-wrap">' +
        donut +
        '<div class="rfqdet-docs-analytics-ring-label"><div class="num">' + counts.all + '</div><div class="unit">FILES</div></div>' +
      '</div>' +
      row('request', 'Request Specs', counts.request) +
      row('product', 'Product Data', counts.product) +
      row('secure', 'Scinode Secure', counts.secure) +
      '<button type="button" class="rfqdet-docs-analytics-cta" onclick="openDocumentsDrawer(' + secureCurrentIdx + ')">' +
        '<span>Explore Repository (' + counts.all + ')</span>' + ICON_ARROW_SM_WHITE +
      '</button>' +
    '</div>';
  }

  function documentsSidebarCardHtml(req, secureCurrentIdx){
    var counts = documentCatalogCounts(buildDocumentCatalog(req, secureCurrentIdx));
    var card = DOCS_CARD_LAYOUT === 'vault' ? documentsCardVaultHtml(secureCurrentIdx, counts)
      : DOCS_CARD_LAYOUT === 'analytics' ? documentsCardAnalyticsHtml(secureCurrentIdx, counts)
      : documentsCardClassicHtml(secureCurrentIdx, counts);
    return documentsCardLayoutToggleHtml() + card;
  }

  window.openDocumentsDrawer = function(secureCurrentIdx){
    var req = currentReq();
    if (!req) return;
    docsDrawerCatalog = buildDocumentCatalog(req, secureCurrentIdx);
    docsDrawerMode = 'flat';
    docsDrawerCategory = 'all';
    docsDrawerSearch = '';
    renderDocsDrawerBody();
    document.getElementById('rfqdet-docs-drawer').classList.add('open');
    document.getElementById('rfqdet-docs-drawer-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeDocumentsDrawer = function(){
    var d = document.getElementById('rfqdet-docs-drawer');
    var b = document.getElementById('rfqdet-docs-drawer-backdrop');
    if (d) d.classList.remove('open');
    if (b) b.classList.remove('open');
    document.body.style.overflow = '';
  };

  window.setDocsDrawerMode = function(mode){
    docsDrawerMode = mode;
    docsDrawerCategory = 'all';
    docsDrawerSearch = '';
    renderDocsDrawerBody();
  };

  window.setDocsDrawerCategory = function(cat, btn){
    docsDrawerCategory = cat;
    switchTab(btn);
    renderDocsDrawerList();
  };

  window.filterDocsDrawer = function(q){
    docsDrawerSearch = q;
    renderDocsDrawerList();
  };

  window.clearDocsDrawerSearch = function(){
    docsDrawerSearch = '';
    var input = document.getElementById('rfqdet-docsdr-search-input');
    if (input) input.value = '';
    renderDocsDrawerList();
  };

  function docsDrawerListHtml(){
    var q = (docsDrawerSearch || '').trim().toLowerCase();
    if (docsDrawerMode === 'categorized'){
      return docsCategoryBodyHtml(docsDrawerCatalog, docsDrawerCategory, docsDrawerSearch);
    }
    var flat = flattenDocumentCatalog(docsDrawerCatalog).filter(function(d){ return docsMatchesQuery(d, q); });
    if (!flat.length){
      return q
        ? catalogEmptyHtml('No documents found', 'Try a different document name.', '<div class="rfqdet-docs-cta-row" style="justify-content:center;"><button type="button" class="mfg-btn-secondary" onclick="clearDocsDrawerSearch()">Clear search</button></div>')
        : catalogEmptyHtml('No documents yet', 'Documents related to this request will appear here as they are shared.');
    }
    return catalogTableCardHtml(flat, true);
  }

  function renderDocsDrawerList(){
    var el = document.getElementById('rfqdet-docsdr-list');
    if (el) el.innerHTML = docsDrawerListHtml();
  }

  function renderDocsDrawerBody(){
    var body = document.getElementById('rfqdet-docs-drawer-body');
    if (!body || !docsDrawerCatalog) return;
    var counts = documentCatalogCounts(docsDrawerCatalog);
    var toggle = '<div class="sbv-toggle" role="tablist" aria-label="Documents view">' +
        '<button type="button" role="tab" aria-selected="' + (docsDrawerMode === 'flat') + '" class="' + (docsDrawerMode === 'flat' ? 'active' : '') + '" onclick="setDocsDrawerMode(\'flat\')">Flat List</button>' +
        '<button type="button" role="tab" aria-selected="' + (docsDrawerMode === 'categorized') + '" class="' + (docsDrawerMode === 'categorized' ? 'active' : '') + '" onclick="setDocsDrawerMode(\'categorized\')">Categorized</button>' +
      '</div>';

      ? '<div class="rfqdet-docs-catnav" role="tablist" aria-label="Document category" style="margin-bottom:14px;">' +
          '<button type="button" class="rfqdet-catnav-btn active" role="tab" aria-selected="true" onclick="setDocsDrawerCategory(\'all\',this)">All <span class="rfqdet-catnav-count">' + counts.all + '</span></button>' +
          '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="setDocsDrawerCategory(\'request\',this)">Request <span class="rfqdet-catnav-count">' + counts.request + '</span></button>' +
          '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="setDocsDrawerCategory(\'product\',this)">Product <span class="rfqdet-catnav-count">' + counts.product + '</span></button>' +
          '<button type="button" class="rfqdet-catnav-btn" role="tab" aria-selected="false" onclick="setDocsDrawerCategory(\'secure\',this)"><span class="rfqdet-catnav-shield">' + ICON_SHIELD_CHECK + '</span>Scinode Secure <span class="rfqdet-catnav-count">' + counts.secure + '</span></button>' +
        '</div>'

    body.innerHTML =
      '<div class="rfqdet-docs-head-row" style="margin-bottom:14px;">' +

        '<div class="rfqdet-docs-search">' + ICON_SEARCH + '<input type="text" id="rfqdet-docsdr-search-input" placeholder="Search documents" oninput="filterDocsDrawer(this.value)"></div>' +
        '<div class="rfqdet-docs-sort">' + ICON_SORT + '<span>Newest first</span></div>' +
      '</div>' +
      catnav +
      '<div id="rfqdet-docsdr-list">' + docsDrawerListHtml() + '</div>';
  }

  function currentReq(){

    var id = params.get('id');
    return id ? getAllRequests().find(function(r){ return r.id === id; }) : null;

  window.rfqAcceptQuote = function(id){
    /* Accepting jumps straight to the Upload Purchase Order stage — Quotation
       Accepted has no actions of its own, it's just the passed-stage summary. */
    saveRequestOverride(id, { status: 'Active', stage: RFQ_LOG_STAGES[4], progress: 80, attentionMessage: 'Quote accepted. Upload your Purchase Order to lock the commercial terms and trigger production scheduling.', attentionActionLabel: 'Upload PO' });
    location.reload();
  };

  window.rfqAskAnotherQuote = function(id){
    var req = currentReq();
    if (!req) return;
    var rounds = rfqQuoteRoundsFor(req).slice();
    var scimplifyCount = rounds.filter(function(r){ return r.from === 'scimplify'; }).length;
    rounds.push({ from: 'customer' });
    rounds.push(buildRfqQuote(req, scimplifyCount));
    saveRequestOverride(id, { rfqQuoteRounds: rounds, status: 'Action Required', attentionMessage: 'New quote available. Review the pricing and terms below, then accept or ask for a revision.' });
    location.reload();
  };

  window.rfqPlaceOrder = function(id){
    var input = document.getElementById('rfqdet-po-input');
    var fileEl = document.getElementById('rfqdet-po-file');
    var number = input ? input.value.trim() : '';
    if (!number){ rfqToast('Enter a PO number to continue'); return; }
    var fileName = (fileEl && fileEl.files && fileEl.files[0]) ? fileEl.files[0].name : 'Purchase_Order.pdf';
    saveRequestOverride(id, { status: 'Completed', stage: RFQ_LOG_STAGES[5], progress: 100, attentionMessage: null, rfqPO: { number: number, fileName: fileName } });
    location.reload();
  };

  window.cmoScheduleCall = function(id){
    saveRequestOverride(id, { cmoCallScheduled: true });
    location.reload();
  };

  window.cmoAcceptOffer = function(id){
    saveRequestOverride(id, { status: 'Completed', stage: CMO_LOG_STAGES[5], progress: 100, attentionMessage: null });
    location.reload();
  };

  window.cmoAskAnotherOffer = function(id){
    var req = currentReq();
    if (!req) return;
    var rounds = cmoOfferRoundsFor(req).slice();
    var scimplifyCount = rounds.filter(function(r){ return r.from === 'scimplify'; }).length;
    rounds.push({ from: 'customer' });
    rounds.push(buildRfqQuote(req, scimplifyCount));
    saveRequestOverride(id, { cmoOfferRounds: rounds, status: 'Action Required', attentionMessage: 'New offer available. Review the pricing and terms below, then accept or ask for a revision.' });
    location.reload();
  };

  window.cdmoSetLabPlant = function(id, val){
    saveRequestOverride(id, { cdmoLabPlant: val });
    location.reload();
  };

  window.cdmoAcceptOffer = function(id){
    saveRequestOverride(id, { status: 'Completed', stage: CDMO_LOG_STAGES[4], progress: 100, attentionMessage: null });
    location.reload();
  };

  window.cdmoAskAnotherOffer = function(id){
    var req = currentReq();
    if (!req) return;
    var rounds = cdmoOfferRoundsFor(req).slice();
    var scimplifyCount = rounds.filter(function(r){ return r.from === 'scimplify'; }).length;
    rounds.push({ from: 'customer' });
    rounds.push(buildRfqQuote(req, scimplifyCount));
    saveRequestOverride(id, { cdmoOfferRounds: rounds, status: 'Action Required', attentionMessage: 'New offer available. Review the pricing and terms below, then accept or ask for a revision.' });
    location.reload();
  };

  window.rdAcceptProposal = function(id){
    saveRequestOverride(id, { status: 'Completed', stage: RD_LOG_STAGES[5], progress: 100, attentionMessage: null });
    location.reload();
  };

  window.rdAskAnotherProposal = function(id){
    var req = currentReq();
    if (!req) return;
    var rounds = rdProposalRoundsFor(req).slice();
    var scimplifyRounds = rounds.filter(function(r){ return r.from === 'scimplify'; });
    var lastRound = scimplifyRounds[scimplifyRounds.length - 1];
    var nextRound = Object.assign({}, lastRound, { round: scimplifyRounds.length, tiers: scaleRdTiers(lastRound.tiers, 0.92) });
    rounds.push({ from: 'customer' });
    rounds.push(nextRound);
    saveRequestOverride(id, { rdProposalRounds: rounds, status: 'Action Required', attentionMessage: 'New proposal available. Review the pricing and terms below, then accept or ask for a revision.' });
    location.reload();
  };

  function init(){
    updateDocsToggleUI();
    var req = currentReq();
    if (!req){
      document.getElementById('rfqdet-page').innerHTML =
        '<div class="rfqdet-notfound"><h2>Request not found</h2><p>This request could not be located. It may have been removed, or the link is incorrect.</p></div>';
      return;
    }
    if (req.type === 'RFQ'){ renderRfqDetail(req); return; }
    if (req.type === 'Sample Request'){ renderRfsDetail(req); return; }
    if (req.type === 'Consultation'){ renderConsultDetail(req); return; }
    if (req.type === 'Manufacturing Project'){ renderCmoDetail(req); return; }
    if (req.type === 'CDMO Project'){ renderCdmoDetail(req); return; }
    if (req.type === 'R&D Project'){ renderRdDetail(req); return; }
    var typeLabel = (TYPE_META[req.type] && TYPE_META[req.type].label) || req.type;
    document.getElementById('rfqdet-page').innerHTML =
      '<div class="rfqdet-notfound"><h2>Full detail view coming soon</h2><p>The dedicated Request Details page for ' + esc(typeLabel) + ' requests is being built next. In the meantime, here is what we have on file for <strong>' + esc(req.id) + '</strong>: ' + esc(req.objective) + '</p></div>';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>
